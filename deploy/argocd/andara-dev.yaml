#
# dev follows the Git tag `dev` (AW-INF-059, ADR-0013 decision 7). `make promote` moves it: one
# signed commit on release/dev above a main commit, whose only change is image.tag in
# values/dev.yaml, pinned by digest. So what runs is what the tag points at, and a merge to main
# changes nothing until someone promotes it. `make argocd-install ENV=dev` applies this with
# server-side apply, and refuses until the tag exists.
#
# - helm.releaseName: andara, so every name and label derived from .Release.Name renders
#   as it does under `make helm-install`, and the move from the Helm release adopts the
#   same objects rather than renaming them.
# - No helm.parameters: everything the render takes is in the tagged commit.
# - Not managed, so a sync never prunes them: the Kafka CR and its topics
#   (`make kafka-install`), the two Secrets (`make argocd-install ENV=dev`), the snapshot
#   PVC (a volumeClaimTemplate), and the cluster platform.
# - The state projector's replica count is the operator's (AW-INF-025): `make projector-stop`
#   holds it at 0 until `projector-start`, and selfHeal would otherwise undo that within
#   seconds. RespectIgnoreDifferences keeps a sync from resetting it either. The chart still
#   creates the Deployment at 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: andara-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/valesordev/andara.valesordev.com
    targetRevision: dev
    path: deploy/helm/andara
    helm:
      releaseName: andara
      valueFiles:
        - ../values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: andara-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: andara-projector-state
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
