# A kind cluster shaped like the box (AW-INF-006 AC-8): the control plane publishes :80
# and :443 on the host and carries the `ingress-ready` label Traefik schedules on. CI
# creates its cluster from this; on the box the cluster already exists.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
