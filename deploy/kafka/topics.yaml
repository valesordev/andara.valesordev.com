# Topic declaration — one source, applied identically to every environment.
#
# ADR-0002 makes Kafka the ordering authority for the entire World, so this file is not
# infrastructure trivia. Two properties in it are effectively permanent:
#
#   * partitions on a keyed topic. Repartitioning changes the key-to-partition mapping and
#     therefore reorders history. There is no safe in-place change; `topics-apply` refuses.
#   * cleanup.policy on the content topics. `delete` on a compacted content topic is the
#     difference between a version history and a version eraser (ADR-0004).
#
# Delivered by AW-INF-004; consumed by AW-INF-002's local stack so that local and
# production topics come from one declaration rather than from a compose-file duplicate.
#
# Retention values are milliseconds (retention.ms) and bytes per partition (retention.bytes).
# -1 means infinite.
#
# Every name below is the topic's name *within* an environment. On the shared broker in
# andara-shared (ADR-0013 decisions 3–5, AW-INF-055) the topic is `<prefix>.<name>`, with the
# prefix from `environments` (`dev.andara.commands.v1`); with an empty prefix it is `<name>`
# (prod, on its own broker). scripts/topics.py builds the name; nothing else does.

# One entry per environment. `prefix` is kafka.topic_prefix (no trailing dot: ADR-0013
# amendment 6). Every other key is a topic config that overrides every topic's own value in
# that environment.
#
# local's are the bound on what one environment can take of the shared brokers' disks
# (ADR-0013 amendment 4: until AW-INF-056 applies the principals' quotas, they're the only
# bound). 64 MiB per partition and 7 days are the ADR's starting values; AW-INF-055 measures
# a local soak and records the values it keeps here. The retention.* keys apply to the topics
# whose cleanup.policy includes delete; compacted topics declare no retention, since without
# delete the broker ignores it (docs/specs/kafka/broker-contract.md, `local.` bounds). The
# segment.* keys apply to every topic.
#
# The segment values are what make the bounds bite: neither retention nor compaction touches
# the active segment, so with Kafka's defaults (1 GiB, 7 days) a partition would hold about
# 1 GiB, for up to a week, before either took effect. At 16 MiB and at most a day, a delete
# partition holds about 80 MiB: local's 134 of them come to about 10.5 GiB at RF 1, spread over
# three 20 GiB PVCs. The contract requires segment.bytes <= retention.bytes / 4 and
# segment.ms <= 86400000.
environments:
  local:
    prefix: local
    retention.bytes: 67108864     # 64 MiB per partition
    retention.ms: 604800000       # 7 days
    segment.bytes: 16777216       # 16 MiB
    segment.ms: 86400000          # 1 day
  dev:
    prefix: dev
  prod:
    prefix: ""

defaults:
  replication_factor:
    local: 1
    dev: 3
    prod: 3
  config:
    min.insync.replicas:
      local: 1
      dev: 2
      prod: 2

topics:
  - name: andara.commands.v1
    partitions: 64
    cleanup.policy: delete
    retention.ms: -1              # infinite
    why: |
      The write-ahead log for the World. 64 partitions is a permanent choice: the
      partition is derived from the Zone key, so repartitioning reorders history.
      Retention must outlive the oldest Snapshot recovery would ever restore from.

  - name: andara.events.v1
    partitions: 64
    cleanup.policy: delete
    retention.ms: 2592000000      # 30 days
    why: |
      Derived Events and Tick Boundary Records. Retention must EXCEED the age of the
      oldest Snapshot recovery would restore from, plus margin — replay reads the Tick
      Boundary Records from here (ADR-0002 §4). Shrinking this to save disk is an
      invisible correctness change, not a capacity change.

  - name: andara.state.v1
    partitions: 64
    cleanup.policy: compact
    min.compaction.lag.ms: 60000
    why: |
      Current state per aggregate. Every index — Redis, Postgres, later ClickHouse — is
      built from this topic rather than from the Event history, so rebuilding an index
      costs live-state time instead of world-age time (ADR-0002 §5.5).
      Written by the state projector (AW-SRV-019) alone, on the commands partitioner —
      hash(zone_id) % 64 — so a Zone's aggregates share a Partition. Every Entity key
      names its Zone, so a key never moves between Partitions and compaction stays correct.
      min.compaction.lag.ms keeps a minute of history uncompacted. The cleaner never touches
      the active segment, so a reader at the head sees every write regardless. The lag is for
      an index reading up to a minute behind, so it still sees intermediate writes rather than
      only the survivors of the last cleaner pass.
      Write ACL: the `andara-projector-state` principal only (AW-SRV-019 AC-9). Declared
      here, not enforced: the broker does not authenticate yet, and the first story that
      turns on SASL applies it and inherits AC-9's assertion.

  - name: andara.audit.v1
    partitions: 6
    cleanup.policy: delete
    retention.ms: 31536000000     # 365 days
    why: |
      Privileged actions. Long retention is the point; this is the record of who did what
      with operator authority.

  - name: andara.accounts.v1
    partitions: 6
    cleanup.policy: compact
    why: |
      Account state. Deliberately not World state — it survives a World rebuild.

  - name: andara.content.blobs.v1
    partitions: 6
    cleanup.policy: compact
    max.message.bytes: 9437184    # 9 MiB
    why: |
      Keys are content hashes, so compaction retains every blob ever published (ADR-0004).
      max.message.bytes is content.max_blob_bytes (8 MiB, AW-SRV-012) plus the Blob envelope's
      headroom. The broker default is 1 MiB, which refuses a valid blob over it with
      MESSAGE_TOO_LARGE after PublishBlob has accepted it (AW-SRV-013). Raise both together.

  - name: andara.content.versions.v1
    partitions: 6
    cleanup.policy: compact
    why: |
      Keys are packID@version, so compaction keeps the whole version history.

  - name: andara.content.active.v1
    partitions: 6
    cleanup.policy: compact
    why: |
      The only mutable pointer in the content pipeline: which version is live. Rollback is
      a write to this topic (ADR-0004).

# Broker settings that are not defaults and are not negotiable.
#
# Split in two because the local broker and the production broker are not the same
# software (ADR-0002 §7: Redpanda locally, real Kafka in production):
#
#   assert  — checked against a real Kafka cluster by `make topics-diff`, never written.
#             Silently rewriting a production broker's configuration is not something a
#             make target should do.
#   local   — applied to the local Redpanda broker by `make topics-apply`, because a local
#             broker is disposable.
broker:
  assert:
    unclean.leader.election.enable: "false"
    # With it enabled, an out-of-sync replica can be elected leader and silently truncate
    # records that were already acknowledged — which means acks=all does NOT guarantee
    # durability. The zero-RPO claim in docs/specs/slo/recovery.md rests on this setting as
    # much as on acks. Redpanda has no equivalent property: its Raft replication cannot
    # elect a leader that is missing committed records, which is one of the few places the
    # local and production brokers genuinely differ rather than merely appearing to.

  local:
    enable_consumer_group_metrics: "[group,partition,consumer_lag]"
    # Off by default because computing it costs the broker something. Per-partition
    # consumer lag is a dashboard panel and a runbook diagnostic (AW-SRV-002), and a metric
    # the broker never computes is a metric nobody has when the World is behind.
    log_segment_ms_min: "1000"
    # Redpanda floors every topic's segment.ms here (10 min by default) and never compacts
    # the active segment, so without this no test can watch compaction happen. At 1 s, a
    # throwaway topic declared with segment.ms=1000, min.cleanable.dirty.ratio=0.01 and
    # delete.retention.ms=1000 rolls, compacts, and drops the tombstone in about 20 s
    # (AW-SRV-019 AC-5, measured 2026-09-26). The floor only permits small segments; every
    # topic above keeps its declared segment.ms.

# Consumer groups, reserved by convention. <env> is local, dev, or prod.
consumer_groups:
  - andara-sim-<env>                 # simulation processes      <- andara.commands.v1
  - andara-projector-state-<env>     # state projector           <- andara.commands.v1 (checkpoints), andara.events.v1 (boundaries)
  - andara-projection-redis-<env>    # Redis index               <- andara.state.v1
  - andara-projection-pg-<env>       # Postgres index            <- andara.state.v1, accounts, audit
  - andara-content-<env>             # content resolver          <- content topics

# Principals: one per workload per environment (ADR-0011 decision 4, as ADR-0013 decision 6
# amends it). scripts/kafka_users.py renders a Strimzi KafkaUser `<name>-<env>` for every
# environment with a prefix, with each topic ACL on the LITERAL name `<prefix>.<topic>` and each
# group ACL PREFIXED on `<group>-<env>`; `make kafka-users-check` validates the render
# (AW-INF-055 AC-9). They are rendered here and applied by AW-INF-056, once the broker has an
# authorizer: a KafkaUser with ACLs on a broker without one sits not-Ready (ADR-0013 amendment
# 19). andara-operator, the one superuser, is platform-scoped and is AW-INF-056's.
#
# No environment principal creates, deletes or reconfigures a topic: that is the operator's
# alone (ADR-0011). andara-projection-redis and andara-projection-pg are declared by AW-SRV-017
# and AW-SRV-018 when they land.
principals:
  - name: andara-server
    topics:
      andara.commands.v1: [Read, Write]
      andara.events.v1: [Read, Write]
      andara.accounts.v1: [Read, Write]
      andara.audit.v1: [Read, Write]
      andara.content.blobs.v1: [Read, Write]
      andara.content.versions.v1: [Read, Write]
      andara.content.active.v1: [Read, Write]
      # No Write on andara.state.v1: the projector is its one writer (AW-SRV-019 AC-9).
    groups:
      andara-sim: [Read]
      andara-content: [Read]
  - name: andara-projector-state
    topics:
      andara.commands.v1: [Read]
      andara.events.v1: [Read]
      andara.state.v1: [Read, Write]
      # The replica loads content exactly as the server does, read-only (cmd/andara-projector).
      andara.content.blobs.v1: [Read]
      andara.content.versions.v1: [Read]
      andara.content.active.v1: [Read]
    groups:
      # Delete: `andara-projector --rebuild` deletes its own group (Committer.Wipe).
      andara-projector-state: [Read, Delete]
    # andara_state_topic_bytes reads DescribeLogDirs, which Kafka authorizes on the cluster.
    cluster: [Describe]

# Quotas per environment, on each of its principals (Strimzi KafkaUser `spec.quotas`, bytes per
# second per broker). They bind once the broker authenticates (AW-INF-056; ADR-0013 amendment
# 4). local's bound one environment's share of the shared brokers; dev has none.
quotas:
  local:
    producerByteRate: 2097152     # 2 MiB/s
    consumerByteRate: 8388608     # 8 MiB/s: a projector rebuild reads the whole log
