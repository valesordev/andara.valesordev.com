# The hand-made Grafana Cloud credentials' expiry dates: names and dates, never values (ADR-0012 decision 4).
# make tf-credentials-check and the daily credentials-expiry job read this file (AW-INF-076); each entry is
# within its window from warn_days (default 14) before it expires. How to make, store and rotate each one,
# and which ones have no expiry: docs/runbooks/grafana-credentials.md. A rotation changes its date here.
# A *_TELEMETRY_TOKEN takes warn_days: 30: a lapsed telemetry token blinds every SLO at once.
credentials:
  # Read 2026-10-20 from solo7dev, Administration → Service accounts.
  - name: GRAFANA_SOLO7DEV_READ_TOKEN
    expires: 2027-01-15
  - name: GRAFANA_SOLO7DEV_APPLY_TOKEN
    expires: 2027-01-15
