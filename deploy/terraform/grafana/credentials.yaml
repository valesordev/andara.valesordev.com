# The hand-made Grafana Cloud credentials' expiry dates: names and dates, never values (ADR-0012 decision 4).
# make tf-credentials-check and the daily credentials-expiry job read this file (AW-INF-076); each entry is
# within its window from warn_days (default 14) before it expires. How to make, store and rotate each one,
# and which ones have no expiry: docs/runbooks/grafana-credentials.md. A rotation changes its date here.
# A *_TELEMETRY_TOKEN takes warn_days: 30: a lapsed telemetry token blinds every SLO at once.
credentials:
  # Read 2026-10-20 from solo7dev, Administration → Service accounts.
  - name: GRAFANA_SOLO7DEV_READ_TOKEN
    expires: 2027-01-15
  - name: GRAFANA_SOLO7DEV_APPLY_TOKEN
    expires: 2027-01-15
  # Re-made 2026-10-20 with an expiry (the first ones had none); read from solo7, Administration → Service accounts.
  - name: GRAFANA_SOLO7_READ_TOKEN
    expires: 2027-01-15
  - name: GRAFANA_SOLO7_APPLY_TOKEN
    expires: 2027-01-15
  # Access-policy tokens made with a 3-month expiry, stored 2026-10-19. A stack token can't read their date, so
  # this is an estimate: made with the 2026-10-17 batch, they expire 2027-01-15; made a day or two earlier,
  # this is that many days late, which the 14-day window absorbs. Correct it from the policy's token list.
  - name: GRAFANA_SOLO7DEV_FLEET_READ_TOKEN
    expires: 2027-01-15
  - name: GRAFANA_SOLO7DEV_FLEET_APPLY_TOKEN
    expires: 2027-01-15
  # Read 2026-10-26 from the andara-solo7dev-telemetry policy's token list (Brian); made 2026-10-24 with 90 days.
  - name: GRAFANA_SOLO7DEV_TELEMETRY_TOKEN
    expires: 2027-01-22
    warn_days: 30
