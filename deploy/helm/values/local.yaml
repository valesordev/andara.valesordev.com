# kind on the developer's box (decided 2026-09-10, v1.36.1). The image is built by
# `make image` and loaded with `make kind-load`; nothing is pulled.
image:
  repository: andara-server
  tag: dev
  pullPolicy: Never

server:
  telemetry:
    environment: local
    log_format: text
    log_level: debug
    otlp_endpoint: ""   # no collector in the local cluster; empty disables export
  content:
    source: dir
    path: /content
# The box's Traefik holds :80/:443 on the kind control plane (the kind port mapping was
# made for it), so the chart binds no host port of its own (AC-8). `andara.local` resolves
# by the /etc/hosts line `make helm-install` prints. Connections from the box arrive at
# Traefik from the docker bridge, not from 127.0.0.1, hence the 172.16/12 allowlist entry.
host: andara.local
admin:
  allowedCIDRs: ["10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"]

snapshots:
  size: 1Gi
  storageClass: standard

contentVolume:
  configMapName: andara-content

resourcesMultiplier: 1
