# dev: the same box as prod today (kind, 2026-09-10), separated by namespace and values
# so that a values-only mistake is caught here first.
image:
  repository: ghcr.io/valesordev/andara-server
  tag: dev
  pullPolicy: Always

server:
  telemetry:
    environment: dev
    log_level: debug

snapshots:
  size: 5Gi
  storageClass: standard

# [ASSUMPTION] host under the box's solo7.valesordev.com zone, private CA until Brian
# picks a public name; `tls.issuer: letsencrypt` is the switch (DNS-01, already on the cluster).
host: andara-dev.solo7.valesordev.com
