# dev: the same box as prod today (kind, 2026-09-10), separated by namespace and values
# so that a values-only mistake is caught here first.
image:
  repository: ghcr.io/valesordev/andara-server
  tag: dev
  pullPolicy: Always

server:
  telemetry:
    environment: dev
    log_level: debug
    # The cluster's Alloy OTLP receiver (Grafana k8s-monitoring, AW-INF-008), which forwards
    # traces to Tempo and log records to Loki. Plaintext gRPC inside the cluster, as the
    # server's exporter dials it.
    otlp_endpoint: k8s-monitoring-alloy-receiver.observability.svc:4317
  character:
    # Where a new Character enters the World (AW-SRV-014). Required outside local: the
    # server's default is the dev fixture's Room, and until AW-SRV-012 serves real content
    # from the store this environment runs that fixture too.
    spawn_room: town/plaza
  # Broker-free until AW-INF-014 installs a Kafka broker in this namespace (decided
  # 2026-09-24, Brian): the same three switches as local. Zone Definitions and the core
  # Templates come from ConfigMaps `make helm-install` builds; Accounts and Commands live in
  # memory and are lost on restart. AW-INF-014 deletes this block and the two below.
  content:
    source: dir
    path: /content
  auth:
    store: memory
    token_key_file: /etc/andara/secrets/token-key/token.keys
  sim:
    source: memory

snapshots:
  size: 5Gi
  storageClass: standard

# Public name under the box's solo7.valesordev.com zone, issued by the cluster's Let's Encrypt
# ClusterIssuer (DNS-01 via Cloudflare) — decided 2026-09-17 (Brian). Clients trust the system
# store; the private CA still signs the server certificate on the second leg.
host: andara-dev.solo7.valesordev.com
tls:
  issuer: letsencrypt

# Broker-free (above): what `make helm-install ENV=dev` creates in the namespace. The
# bootstrap operator's credential comes from ANDARA_BOOTSTRAP_OPERATOR, which the install
# requires here: this edge is a public hostname.
secrets:
  tokenKey:
    secretName: andara-server-token-key
  bootstrapOperator:
    secretName: andara-server-bootstrap

contentVolume:
  configMapName: andara-content
  templatesConfigMapName: andara-content-templates
