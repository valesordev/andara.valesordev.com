# dev: the same box as prod today (kind, 2026-09-10), separated by namespace and values
# so that a values-only mistake is caught here first.
image:
  repository: ghcr.io/valesordev/andara-server
  tag: dev
  pullPolicy: Always

server:
  telemetry:
    environment: dev
    log_level: debug
    # The cluster's Alloy OTLP receiver (Grafana k8s-monitoring, AW-INF-008), which forwards
    # traces to Tempo and log records to Loki. Plaintext gRPC inside the cluster, as the
    # server's exporter dials it.
    otlp_endpoint: k8s-monitoring-alloy-receiver.observability.svc:4317
    # One trace per operator action (AW-INF-021, SRE's call on architecture's §8 question): the
    # CLI's cli.command parents the RPC span, so an activation is one trace from the Builder's
    # command to the World's content.swap, and its audit record carries the CLI's trace_id. dev is
    # reached only over the tailnet or a port-forward, so a client choosing its own sampling costs
    # nothing here. prod keeps the default, false.
    trust_inbound_traceparent: true
  character:
    # Where a new Character enters the World (AW-SRV-014): Purgatory, in every environment
    # (Brian, 2026-09-26; AW-INF-024). Required outside local, and set explicitly in local
    # too, so the server's compiled-in default (town/plaza) no longer matters anywhere.
    spawn_room: purgatory/start
  # The namespace's Kafka `andara-log` (AW-INF-014, `make kafka-install ENV=dev`): the sim's
  # command log and the Account store live there, as sim.source and auth.store default to.
  kafka:
    brokers: andara-log-kafka-bootstrap:9092
  # Content comes from the namespace's content store (AW-INF-021): every pack with an Active
  # Pointer, the server's own andara.core (published at boot, AW-SRV-013) and the dev fixture
  # pack `town` (`make content-seed ENV=dev`). Nothing is mounted from git any more.
  content:
    source: kafka
    packs: "*"
  auth:
    token_key_file: /etc/andara/secrets/token-key/token.keys
  # Snapshots in the namespace's object store (AW-INF-025, `make objectstore-install ENV=dev`),
  # so the state projector reads the rounds the server writes. The StatefulSet's snapshot PVC
  # stays, unused, until AW-INF-007 retires it. Rollback: store back to fs, and the projector
  # off, in one revert.
  snapshot:
    store: s3
    s3_bucket: andara-snapshots-dev
    s3_endpoint: http://andara-objectstore:9000

projectors:
  state:
    enabled: true

snapshots:
  size: 5Gi
  storageClass: standard

# Public name under the box's solo7.valesordev.com zone, issued by the cluster's Let's Encrypt
# ClusterIssuer (DNS-01 via Cloudflare) — decided 2026-09-17 (Brian). Clients trust the system
# store; the private CA still signs the server certificate on the second leg.
host: andara-dev.solo7.valesordev.com
tls:
  issuer: letsencrypt

# What `make helm-install ENV=dev` creates in the namespace for the content and auth above.
# The bootstrap operator's credential comes from ANDARA_BOOTSTRAP_OPERATOR, which the install
# requires here: this edge is a public hostname.
# The tailnet (Tailscale's 100.64.0.0/10, CGNAT, unroutable from the internet). dev's edge resolves
# only there, and Traefik sees each device's own tailnet address (the box's is 100.79.240.98), so
# without this every Admin call, a Builder's `content publish` included, is 403 at the edge
# (AW-INF-021, found on the rollout). The chart's private ranges stay.
admin:
# The box's own docker bridges (172.16.0.0/12, as values/local.yaml has them). A connection
# from the box that Docker's userland proxy carries (docker-proxy holds 0.0.0.0:443), rather
# than its iptables DNAT, reaches Traefik from the kind network's gateway, 172.19.0.1. That's
# true over loopback, and plausibly over the tailnet's IPv6 address. On 2026-10-02 Brian's
# walk-through got 403 that way, while the same box over the tailnet's IPv4 address arrived as
# 100.79.240.98 (#305).
  allowedCIDRs: ["10.0.0.0/8", "192.168.0.0/16", "100.64.0.0/10", "172.16.0.0/12"]

secrets:
  tokenKey:
    secretName: andara-server-token-key
  bootstrapOperator:
    secretName: andara-server-bootstrap
  snapshotS3:
    secretName: andara-snapshot-s3

# No content ConfigMaps: dev reads the content store (AW-INF-021). local still renders them.
contentVolume:
  render: false
