# Chart defaults. Every key is described in values.schema.json, which `helm template`
# enforces; a key not in the schema fails to render (AW-INF-003 AC-5).
#
# Server configuration goes under `server`, keyed exactly as the story config tables
# (`server.content.source`), and is rendered to the ANDARA_* env the binary reads by the
# generated templates/_env.tpl. Only keys the running binary reads are accepted; a
# groomed-but-unbuilt key is rejected by the schema until its story lands.

replicaCount: 1

image:
  repository: andara-server
  tag: dev
  pullPolicy: IfNotPresent
  # The local build: a hash of the binaries the image carries, which helm-install ENV=local sets.
  # local's tag never changes and its image is never pulled, so this pod-template annotation is
  # what rolls the pods onto a new build, and only then: the image's own ID changes on every
  # rebuild, the binaries only when what they're built from does (AW-INF-060). Empty renders
  # nothing; a registry image is pinned by its digest instead.
  build: ""

server:
  telemetry:
    environment: dev
  grpc:
    # Where the chart mounts secrets.tlsCert (AW-SRV-005: no plaintext mode, so every
    # environment needs these). The Secret is issued by cert-manager (AW-INF-006).
    tls_cert_file: /etc/andara/secrets/tls/tls.crt
    tls_key_file: /etc/andara/secrets/tls/tls.key

# Secret *references*. Never material. Each mounts under /etc/andara/secrets/<name>/ with
# mode 0400 when secretName is set; the env var naming the file is a server key set under
# `server` once its story has landed (AW-SRV-005 for TLS, AW-SRV-008 for the token key).
secrets:
  tokenKey:
    secretName: ""
    key: token.keys
  # Issued by cert-manager from `tls.privateIssuer` when ingress.enabled (AW-INF-006);
  # the name is the Certificate's secretName, so the pod mounts what it issues.
  tlsCert:
    secretName: andara-server-tls
    certKey: tls.crt
    keyKey: tls.key
  kafkaCreds:
    secretName: ""
  # The snapshot store's S3 credential, by envFrom into the server and the projectors, when
  # server.snapshot.store is s3 (AW-INF-025). `make objectstore-install` creates it as
  # andara-snapshot-s3. The server's S3 store reads it through the default credential chain.
  snapshotS3:
    secretName: ""
  # `username:password` for the first operator Account (AW-SRV-008). Injected as
  # ANDARA_AUTH_BOOTSTRAP_OPERATOR from the Secret, applied by the server only while no
  # operator exists, and ignored afterwards — so it can stay set without being a back door.
  bootstrapOperator:
    secretName: ""
    key: bootstrap-operator

# Empty means "derive from measurements.yaml × resourcesMultiplier". Set explicitly only
# when a measurement is not what you want to run against.
resources: {}
resourcesMultiplier: 1.5

# Must cover the pre-stop snapshot: AW-INF-007 asserts
# >= snapshot.upload_timeout + deploy.notice_lead + 2 ticks + 10 s.
terminationGracePeriodSeconds: 90

snapshots:
  size: 20Gi
  storageClass: ""

probes:
  # Recovery in progress. 10 s × 60 = 600 s, which must exceed AW-SRV-007's measured
  # worst-case recovery by 3× (AC-7).
  startup:
    periodSeconds: 10
    failureThreshold: 60
    timeoutSeconds: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

pdb:
  enabled: true
  # 0 at replicaCount 1: a deploy *is* the interruption until sharding is active (ADR-0001).
  minAvailable: 0

# Edge (AW-INF-006): TLS terminated by the cluster's Traefik, re-originated to the pod as
# HTTPS/HTTP-2 through a ServersTransport that trusts the private CA. Two Ingresses on
# `host`: `/` for Game, `/andara.admin.v1.Admin/` behind the operator allowlist.
ingress:
  enabled: true
  className: traefik
  entrypoint: websecure
host: andara.local

tls:
  # ClusterIssuer for the edge certificate. `andara-ca` is the cluster's private CA, and
  # `letsencrypt` and `letsencrypt-staging` the ACME issuers for a public host; `make
  # platform-up` applies all three from deploy/k8s/cert-manager/ (AW-INF-054).
  issuer: andara-ca
  # ClusterIssuer for the server (pod) certificate; always the private CA, because the
  # second leg is verified against it and an ACME issuer cannot sign a .svc name.
  privateIssuer: andara-ca
  duration: 2160h     # 90 d
  renewBefore: 240h   # 10 d

admin:
  # Source ranges the Admin Ingress admits; everything else is 403 at the edge and the
  # server never sees it. On the box, a CLI through the workstation's nginx arrives as the
  # address it dialed from (PROXY protocol): the tailnet's 100.64.0.0/10 by DNS, 127.0.0.1 by
  # --resolve; one that dials 127.0.0.1:8443 directly arrives from the kind network's gateway in
  # 172.16.0.0/12 — see values/local.yaml.
  allowedCIDRs: ["10.0.0.0/8", "192.168.0.0/16"]

networkPolicy:
  enabled: true
  observabilityNamespace: observability
  ingressNamespace: traefik
  agentNamespace: andara-agents

serviceAccount:
  create: true
  name: ""

alerts:
  enabled: true

# Scrape annotations on the server and projector pod templates (AW-INF-008). The cluster's
# Alloy scrapes by annotation (Grafana k8s-monitoring, annotation autodiscovery), so this is
# what makes a pod's /metrics leave the pod; `k8s.grafana.com/job` sets the job the alert
# selectors name. The scraper runs in networkPolicy.observabilityNamespace, which the
# NetworkPolicy already admits to the http port. false renders none, for a cluster that
# discovers targets some other way.
observability:
  annotations: true

# Release markers (docs/specs/deploy/lifecycle.md): rolled_back_to names the tag a rollback
# returned to, empty otherwise. No template reads it; it's the record in the values. On dev a
# rollback promotion commits it (`make promote ENV=dev TAG=dev-<n>`, AW-INF-059).
release:
  rolled_back_to: ""

# The in-cluster snapshot object store: the shared gateway in andara-shared for local and dev
# (AW-INF-058), so its Service by FQDN. server.snapshot.s3_endpoint names this host where
# server.snapshot.store is s3; helm-test holds the two together. prod's own per-namespace store
# (AW-INF-025) would set its in-namespace name here; prod.yaml doesn't use s3 yet (AW-INF-078).
objectstore:
  service: andara-objectstore.andara-shared.svc

# `state` has a binary (AW-SRV-019: `andara-projector state`, in the server image). It runs on
# an environment once its snapshot store is s3 (so it reads the rounds the server writes) and
# `make projector-stop/-start/-rebuild` operate it (AW-INF-025, #80). kafkaCreds is its own
# principal (ADR-0011): empty renders no mount, and it never falls back to the server's.
# redis and postgres have no binary yet
# (AW-SRV-017, AW-SRV-018); enabling one renders a Deployment that exits 1 on an unknown
# projection.
projectors:
  state:
    enabled: false
    replicas: 1
    resources: {}
    kafkaCreds:
      secretName: ""
  redis:
    enabled: false
    replicas: 1
    resources: {}
  postgres:
    enabled: false
    replicas: 1
    resources: {}

# Mount a ConfigMap of Zone Definition JSON at /content for `server.content.source: dir`.
# With `render: true` the chart renders both ConfigMaps from files/content and
# files/content-templates, symlinks to testdata/content/valid and content/core/templates,
# so helm-install and Argo CD build them from git alike (AW-INF-019). A fixture change
# rolls the pod through checksum/content.
contentVolume:
  render: false
  configMapName: ""
  templatesConfigMapName: ""

podAnnotations: {}
