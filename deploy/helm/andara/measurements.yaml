# Measured tick cost, committed from `make measure-tick ENV=<env>` (AW-INF-003 AC-10).
#
# Resource requests derive from these numbers × resourcesMultiplier unless a values file
# sets resources.requests explicitly. Integers, not quantities, because Helm can multiply
# 500 and cannot multiply "500m".
#
# measured: false means no measurement on the sizing fixture has been taken yet, and the
# numbers below are a placeholder that `make helm-test` warns about on every run until a
# real one replaces them. The tick loop exists (AW-SRV-002) and `make measure-tick` runs;
# its first measurement — p99 10 millicores, 94 MiB, over testdata/content/valid with no
# Commands on the memory source, 2026-09-17 — is an idle floor, and sizing production on
# it would be worse than this placeholder. The sizing fixture is AW-SRV-006's; run the
# measurement against it when it exists and flip this then.
measured: false
measured_at: ""
fixture: "sizing fixture, AW-SRV-006 test plan: 2,000 Rooms / 25,000 Entities (Brian, 2026-09-22) / 500 Characters"
server:
  cpu_millicores_p99: 500
  memory_mib_p99: 512
projector:
  # A state projector is a full replica of World state (AW-SRV-019), so it shares the
  # server's memory number; redis and postgres projectors are small.
  state:    {cpu_millicores_p99: 250, memory_mib_p99: 512}
  redis:    {cpu_millicores_p99: 100, memory_mib_p99: 128}
  postgres: {cpu_millicores_p99: 100, memory_mib_p99: 128}
