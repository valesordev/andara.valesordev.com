{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress to the server pod (AW-INF-003 skeleton, AW-INF-006 rules): the http
# port admits the observability namespace for scrapes; the grpc port admits the ingress
# controller's namespace and the Behavior Agent namespace, and nothing else in the
# cluster reaches it directly (AC-6). This is the L3 half of "Admin on the same listener,
# restricted by network"; the L7 half is the allowlist on the Admin Ingress. kubelet
# probes come from the node, which no NetworkPolicy governs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "andara.name" . }}
  labels:
    {{- include "andara.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "andara.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.agentNamespace }}
      ports:
        - port: grpc
          protocol: TCP
{{- end }}
