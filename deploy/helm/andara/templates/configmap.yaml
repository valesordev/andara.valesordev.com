# Server configuration as environment, one ANDARA_* entry per key set under `server`
# (templates/_env.tpl is generated from keys.yaml by `make values-schema`). The
# StatefulSet consumes this with envFrom and rolls on its checksum, so a values change
# is a deploy, not a drift.
{{- /*
On the shared broker local's topics are `local.<name>` (ADR-0013 decision 4, AW-INF-055), so a
local render without the prefix would point the server at names that aren't its own. dev's
check is the values schema's allOf (schema.base.yaml, AW-INF-059, amendment 16).
*/ -}}
{{- $server := .Values.server | default dict }}
{{- if eq (toString (dig "telemetry" "environment" "" $server)) "local" }}
{{- $_ := required "server.kafka.topic_prefix is required when server.telemetry.environment is local: set it to local (AW-INF-055)" (dig "kafka" "topic_prefix" "" $server) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "andara.name" . }}-config
  labels:
    {{- include "andara.labels" . | nindent 4 }}
data:
  {{- include "andara.serverEnv" . | nindent 2 }}
