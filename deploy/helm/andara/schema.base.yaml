# Hand-written half of values.schema.json (AW-INF-003 AC-5). `make values-schema` merges
# the generated `server` subtree in and writes values.schema.json; edit this, never that.
#
# additionalProperties is false everywhere: a typo in a values file must fail `helm
# template`, not render a chart that quietly ignores it.
$schema: https://json-schema.org/draft/2020-12/schema
title: andara chart values
type: object
additionalProperties: false
required: [replicaCount, image, snapshots, probes, terminationGracePeriodSeconds, host, ingress, tls, admin]
properties:
  replicaCount:
    type: integer
    minimum: 1
    maximum: 64
    description: StatefulSet replicas. Each replica owns the Partitions p where p mod replicaCount == ordinal (ADR-0001).
  image:
    type: object
    additionalProperties: false
    required: [repository, tag]
    properties:
      repository: {type: string, minLength: 1}
      tag: {type: string, minLength: 1}
      pullPolicy: {type: string, enum: [Always, IfNotPresent, Never]}
  server:
    type: object
    description: GENERATED from keys.yaml — see values.schema.json.
  secrets:
    type: object
    additionalProperties: false
    description: Secret references only. A value here is a Secret name, never secret material (AC-4).
    properties:
      tokenKey:
        type: object
        additionalProperties: false
        properties:
          secretName: {type: string}
          key: {type: string, minLength: 1}
      tlsCert:
        type: object
        additionalProperties: false
        properties:
          secretName: {type: string}
          certKey: {type: string, minLength: 1}
          keyKey: {type: string, minLength: 1}
      kafkaCreds:
        type: object
        additionalProperties: false
        properties:
          secretName: {type: string}
      bootstrapOperator:
        type: object
        additionalProperties: false
        properties:
          secretName: {type: string}
          key: {type: string, minLength: 1}
  resources:
    type: object
    additionalProperties: false
    description: Explicit overrides. When empty, requests derive from measurements.yaml × resourcesMultiplier.
    properties:
      requests:
        type: object
        additionalProperties: false
        properties:
          cpu: {type: string}
          memory: {type: string}
      limits:
        type: object
        additionalProperties: false
        properties:
          cpu: {type: string}
          memory: {type: string}
  resourcesMultiplier:
    type: number
    minimum: 1
    maximum: 4
    description: Headroom over the p99 in measurements.yaml when resources.requests is not set.
  terminationGracePeriodSeconds:
    type: integer
    minimum: 30
    maximum: 3600
    description: Must cover the pre-stop snapshot (AW-INF-007 derives it).
  snapshots:
    type: object
    additionalProperties: false
    required: [size]
    properties:
      size:
        type: string
        pattern: "^[0-9]+(Mi|Gi|Ti)$"
      storageClass: {type: string}
  probes:
    type: object
    additionalProperties: false
    required: [startup, readiness, liveness]
    properties:
      startup: {$ref: "#/$defs/probe"}
      readiness: {$ref: "#/$defs/probe"}
      liveness: {$ref: "#/$defs/probe"}
  pdb:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      minAvailable: {type: integer, minimum: 0}
  ingress:
    type: object
    additionalProperties: false
    description: "Edge routing through the cluster's Traefik (AW-INF-006): two Ingresses on `host`, HTTPS/HTTP-2 to the pod."
    required: [enabled]
    properties:
      enabled: {type: boolean}
      className: {type: string, minLength: 1}
      entrypoint: {type: string, minLength: 1, description: Traefik entrypoint the routers bind to; websecure is the cluster's :443.}
  host:
    type: string
    pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$"
    description: The one hostname both Ingresses serve and the edge certificate's SAN.
  tls:
    type: object
    additionalProperties: false
    required: [issuer]
    properties:
      issuer:
        type: string
        enum: [andara-ca, letsencrypt, letsencrypt-staging]
        description: ClusterIssuer for the edge certificate. andara-ca is bootstrapped by `make helm-install`; the ACME issuers are the cluster's own.
      privateIssuer:
        type: string
        enum: [andara-ca]
        description: ClusterIssuer for the server certificate the pod presents on the second leg. Always the private CA.
      duration: {type: string, pattern: "^[0-9]+h$"}
      renewBefore: {type: string, pattern: "^[0-9]+h$"}
  admin:
    type: object
    additionalProperties: false
    required: [allowedCIDRs]
    properties:
      allowedCIDRs:
        type: array
        minItems: 1
        description: Source ranges the Admin Ingress admits (Traefik ipAllowList); every other source is 403 at the edge.
        items:
          type: string
          pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$"
  networkPolicy:
    type: object
    additionalProperties: false
    description: Default-deny ingress to the server pod; the grpc port admits ingressNamespace and agentNamespace only (AW-INF-006 AC-6).
    properties:
      enabled: {type: boolean}
      observabilityNamespace: {type: string}
      ingressNamespace: {type: string}
      agentNamespace: {type: string}
  serviceAccount:
    type: object
    additionalProperties: false
    properties:
      create: {type: boolean}
      name: {type: string}
  alerts:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
  projectors:
    type: object
    additionalProperties: false
    description: One Deployment each (AW-SRV-017/018/019). Disabled until their binaries exist.
    properties:
      state: {$ref: "#/$defs/projector"}
      redis: {$ref: "#/$defs/projector"}
      postgres: {$ref: "#/$defs/projector"}
  contentVolume:
    type: object
    additionalProperties: false
    description: "When configMapName is set, that ConfigMap is mounted read-only at /content for server.content.source=dir (local and CI); templatesConfigMapName, a ConfigMap cannot hold a subdirectory, is mounted at /content/templates — the core pack a Character is made from (AW-SRV-014). Production content comes from the store (ADR-0004)."
    properties:
      configMapName: {type: string}
      templatesConfigMapName: {type: string}
  podAnnotations:
    type: object
    additionalProperties: {type: string}
$defs:
  probe:
    type: object
    additionalProperties: false
    required: [periodSeconds, failureThreshold]
    properties:
      periodSeconds: {type: integer, minimum: 1, maximum: 300}
      failureThreshold: {type: integer, minimum: 1, maximum: 1000}
      timeoutSeconds: {type: integer, minimum: 1, maximum: 60}
  projector:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      replicas: {type: integer, minimum: 1, maximum: 1}
      resources:
        type: object
        additionalProperties: false
        properties:
          requests:
            type: object
            additionalProperties: false
            properties:
              cpu: {type: string}
              memory: {type: string}
          limits:
            type: object
            additionalProperties: false
            properties:
              cpu: {type: string}
              memory: {type: string}
