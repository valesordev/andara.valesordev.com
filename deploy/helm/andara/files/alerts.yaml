# Prometheus alerting rules for the andara-server workload (AW-INF-003).
#
# Symptom-based, tied to docs/specs/slo/world-write-availability.md. Each alert names its
# runbook; a rule without one is an incomplete story (CLAUDE.md §7). This file is the source
# of the Grafana-managed rules in every Grafana Cloud stack (ADR-0012 decision 1, AW-INF-047):
# deploy/terraform/grafana/modules/stack/rules.tf reads it and renders one rule group per
# `groups[]` entry. The chart also ships it as a ConfigMap.
#
# Several environments per stack (AW-INF-008, ADR-0012 decisions 1 and 9). `solo7dev` holds
# `local`, `dev` and `staging`, told apart by the `environment` label the collectors stamp,
# with `namespace` as the source within one. So every alert carries both labels it is about:
# a `dev` outage pages as `dev`, and never needs another environment to be down too before it
# fires. Rules that compare one series with itself already do; every aggregation is
# `by (environment, namespace)` and every join `on (environment, namespace)`; and a series
# whose own `namespace` is not the Andara one (Traefik's, cert-manager's) has both rewritten
# to the ones it describes, from decision 9's table. A series with no `namespace` (the
# retired compose stack's shape) aggregates to one group with neither label.
# deploy/helm/tests/alerts_test.yaml proves both shapes under `promtool test rules` in
# `make helm-test`.
#
# A line ending `# env:<environment>` is an absence line that only a stack requiring that
# environment evaluates (ADR-0012 decision 12): the renderer drops it for every other stack,
# so each one is an independent `or` operand after a never-true `vector(0) < 0`. Prometheus
# reads the marker as a comment. `scripts/alerts_sync.py sync` refuses a file that has one: the
# legacy ruler is frozen at AW-INF-047 (ADR-0012 decision 7, amendment of 2026-10-19).
groups:
  - name: andara-server
    rules:
      - alert: AndaraServerUnavailable
        # The server's own scrape, not kube_state: it is the same signal in the compose stack
        # and the cluster, and a StatefulSet that has been deleted outright has no kube_*
        # series to be zero. On the cluster the pod is scraped by annotation under
        # job="andara-server" (the chart's `observability.annotations`, AW-INF-008).
        #
        # On the cluster, down is usually *absence*: the annotation scrape keeps only Ready
        # pods, so a pod failing readiness — or deleted with its StatefulSet — drops out of
        # the target list and its `up` goes stale. `up == 0` there is the rarer case, a
        # Ready pod whose /metrics the scraper cannot reach. absent() of the whole job
        # would need every environment gone before it fired; so one absent() per
        # environment that must exist, each carrying its environment and namespace (absent()
        # copies only its equality matchers' labels onto the result). Each is marked
        # `# env:<environment>`, and a stack renders only the ones its required_environments
        # names (ADR-0012 decision 12). `local` is never required: it is a developer install,
        # not an environment that must be up.
        #
        # The absent() lines are guarded by the presence of the box's chart scrape
        # (ADR-0014 §9, A3): any `up` with a namespace, other than Fleet's `andara-shared`
        # series (which reach the stack through the receiver, not the metrics collector, so
        # they'd satisfy the guard while the collector that scrapes the server is dead and
        # page a collector fault as "server unavailable") and CI's (`cluster="ci"`, which
        # never says anything about the box). With nothing reporting at all, no absence is
        # meaningful, and every line stays silent. A statically scraped server that stops
        # is `up == 0`, never no `up`, and needs no absent() of its own.
        expr: |
          max by (environment, namespace) (up{job="andara-server"}) == 0
            or (
                 vector(0) < 0
              or absent(up{job="andara-server", environment="dev", namespace="andara-dev"})    # env:dev
              or absent(up{job="andara-server", environment="prod", namespace="andara-prod"})  # env:prod
            ) and on() count(up{cluster!="ci", namespace!="", namespace!="andara-shared"}) > 0
        for: 2m
        labels:
          severity: page
          slo: world-write-availability
        annotations:
          summary: "No ready andara-server pod for 2 minutes — players cannot connect"
          runbook: docs/runbooks/server-unavailable.md
      - alert: AndaraServerCrashLooping
        # kube-state-metrics labels each series with the pod's own namespace (its scrape
        # sets none of its own to collide with), and the destinations stamp the environment
        # from it, so this is per-environment as written.
        expr: |
          increase(kube_pod_container_status_restarts_total{container="server", pod=~"andara-[0-9]+"}[10m]) > 3
        for: 0m
        labels:
          severity: page
          slo: world-write-availability
        annotations:
          summary: "andara-server restarted more than 3 times in 10 minutes"
          runbook: docs/runbooks/server-crashlooping.md
  - name: andara-recovery
    # AW-SRV-007, tied to docs/specs/slo/recovery.md: "a World that recovered to the wrong
    # state must never take traffic". Ships with AW-SRV-007; before it the gauge has no series
    # and the rule evaluates nothing.
    rules:
      - alert: RecoveryStateMismatch
        # The server sets the gauge to 0 on exit 8 (the State Hash differs after replay) and on
        # exit 6 (a round that doesn't reproduce its own tick), then exits. It is never
        # pre-seeded: a registered gauge exposes 0 at once, so a 0 before recovery had set it
        # would fire this on every normal boot. A process that exits at once is never scraped, so
        # compose sets recovery.mismatch_linger to 60s, which holds /metrics and /livez up for
        # that long (the projector's haltLinger). Compose restarts the server on failure
        # (restart: on-failure, AW-SRV-026), so a refused recovery loops: each cycle recovers,
        # mismatches, sets the 0, lingers, exits, and its target goes stale until the next
        # linger. keep_firing_for bridges those gaps and keeps the page visible for 15 m after
        # the loop is stopped (`docker compose stop`) or its cause is fixed.
        #
        # On the cluster the first clause can't fire: the annotation scrape keeps only Ready
        # pods, and a refused recovery was never Ready, so the 0 is never scraped, linger or
        # not. The second clause (AW-INF-009) reads kube-state-metrics instead: the server
        # container's last termination exited 8 or 6 (AW-SRV-007's exit table) and it is not
        # Ready. A last-terminated exit code stays on the container until its next termination,
        # so without the `ready == 0` term a fixed server would keep the alert firing; with it
        # the alert resolves once the container is Ready, after keep_firing_for. Any other exit
        # code (1, 5, and 2, which is Go's exit on a panic) is AndaraServerCrashLooping's.
        # Each clause is empty where the other applies: compose has no kube-state-metrics.
        # The `and on (environment, namespace)` matches per namespace, which is per server while
        # each environment runs one server pod; if AW-INF-011 ever scales the StatefulSet, add
        # `pod` to both `max by` lists and to the `on`. The exit code outlives the
        # recovery, so a fixed server that later goes unready for another reason (a readiness
        # probe) pages this again; the runbook says how to tell. One alert name, one runbook,
        # for compose and the cluster.
        expr: |
          andara_recovery_state_hash_match == 0
          or
          (
            max by (environment, namespace) (
                kube_pod_container_status_last_terminated_exitcode{container="server", pod=~"andara-[0-9]+"} == 8
              or
                kube_pod_container_status_last_terminated_exitcode{container="server", pod=~"andara-[0-9]+"} == 6
            )
            and on (environment, namespace)
            max by (environment, namespace) (
              kube_pod_container_status_ready{container="server", pod=~"andara-[0-9]+"} == 0
            )
          )
        for: 0m
        keep_firing_for: 15m
        labels:
          severity: page
          slo: recovery
        annotations:
          summary: "A recovery did not reproduce the recorded World state — the server refused to take traffic"
          runbook: docs/runbooks/recovery-state-mismatch.md
  - name: andara-tick
    # The tick loop (AW-SRV-002). One alert, on the symptom: players experience the world
    # responding late, which is lag. Overruns and consumer lag are causes — dashboard
    # panels and the runbook's diagnostic path, never pages (docs/specs/slo/tick-health.md).
    rules:
      - alert: SimulationLagging
        # Per-series: the scrape's `namespace` rides through the comparison.
        expr: |
          andara_simulation_lag_seconds > 0.5
        for: 2m
        labels:
          severity: page
          slo: tick-health
        annotations:
          summary: "The simulation is more than 500 ms behind schedule — the World is responding late"
          runbook: docs/runbooks/simulation-lagging.md
  - name: andara-kafka
    # The Command log (ADR-0002) underneath the World, both directions (AW-INF-039). Writes:
    # WorldReadOnly, tied to docs/specs/slo/world-write-availability.md. Reads:
    # SimulationConsumerLagging, tied to docs/specs/slo/kafka-availability.md. Both gauges are
    # per Partition (64 series per environment, bounded by deploy/kafka/topics.yaml); each rule
    # takes the max per namespace and never pages per Partition.
    rules:
      - alert: WorldReadOnly
        # One degraded Partition pages: its Zones' players cannot act (AW-INF-039 ruling 2).
        # for: is 30 s, and ingress.degraded_hold (default 120 s, floor 90 s) must be at least
        # 2 x for + 30 s; `make helm-test` fails if this for: and the key's default disagree.
        # Raise them together (docs/specs/kafka/client-contract.md).
        #
        # Under a persistent produce fault the gauge saw-tooths: 1 for the hold, then 0 until
        # the next Submit rediscovers the fault, up to ingress.produce_deadline (2 s). That gap
        # is not recovery (ruling 3). keep_firing_for bridges it, plus the scrape and evaluation
        # that might see it, so the page neither resolves nor re-fires. The cost is a resolve
        # 2 m after a real recovery.
        expr: |
          max by (environment, namespace) (andara_ingress_degraded) == 1
        for: 30s
        keep_firing_for: 2m
        labels:
          severity: page
          slo: world-write-availability
        annotations:
          summary: "The World is read-only: at least one Partition of the Command log refuses writes, and its players cannot act"
          runbook: docs/runbooks/world-read-only.md
      - alert: SimulationConsumerLagging
        # Offsets, not time: andara_consumer_lag is the broker's end offset minus the loop's
        # next-to-read. 400 offsets is 2.5 s (sim.tick_budget_ms x 50) at a Partition's fair
        # share of sim.max_per_tick; the derivation, and the one place to change it, is
        # docs/specs/slo/kafka-availability.md. Not SimulationLagging: the tick can run on time
        # while the Commands it applies arrive late, and the runbook tells the two apart first.
        expr: |
          max by (environment, namespace) (andara_consumer_lag) > 400
        for: 2m
        labels:
          severity: page
          slo: kafka-availability
        annotations:
          summary: "The simulation is more than 400 offsets behind the Command log on a Partition for 2 minutes — players' Commands are applied late"
          runbook: docs/runbooks/simulation-consumer-lagging.md
  - name: andara-snapshots
    # Zone snapshots (AW-SRV-006). One alert, and deliberately a ticket rather than a page:
    # a stale snapshot costs recovery *time*, not data. Kafka is the ordering authority and an
    # older round replays correctly, so RPO is unaffected and no player is experiencing
    # anything. (Losing *every* round is different: past andara.events.v1's 30-day retention
    # that World cannot be recovered at all, docs/specs/slo/recovery.md.) What it threatens is the RTO target
    # (docs/specs/slo/recovery.md) and AW-INF-007's rollback window, which is measured in
    # snapshot rounds — which is why it blocks a deploy even though it does not page.
    #
    # Three cadences rather than one: a single missed round is a failed Put that the next
    # round fixes, and paging a human for a self-healing condition is how an alert gets
    # muted. The failure counters are the runbook's diagnostic path, not alerts of their
    # own (CLAUDE.md §7).
    #
    # The threshold is read from the process rather than baked in here, because
    # snapshot.interval is a chart value: a rule hard-coded to the 60 s default fires
    # before the first round on a ten-minute cadence and detects far too late on a short
    # one. The `> 0` guard is the other half — snapshots being switched off is not a stale
    # snapshot, and without it the age gauge climbs forever and the alert never clears.
    #
    # The age is the left-hand side deliberately: `and` in PromQL yields the left side's
    # values, so the firing alert carries the number the operator needs — how stale — and
    # not the cadence it was measured against.
    rules:
      - alert: SnapshotStale
        expr: |
          andara_snapshot_age_seconds > 3 * andara_snapshot_interval_seconds
            and andara_snapshot_interval_seconds > 0
        for: 5m
        labels:
          severity: ticket
          slo: recovery
        annotations:
          summary: "No complete snapshot round in over three cadences — recovery would be slower than the RTO target"
          runbook: docs/runbooks/snapshot-stale.md
  - name: andara-projections
    # The state projector (AW-SRV-019) and the indexes after it, tied to
    # docs/specs/slo/projection-freshness.md. Tickets, not pages: no player reads a
    # projection. Both compare one projector's series with itself, so each fires per
    # namespace without an aggregation. Neither can see a projector that is not running
    # (the SLO's known gaps); the runbooks start from the pod's last exit code.
    rules:
      - alert: StateProjectorDiverged
        # The projector holds /metrics up for a minute after a divergence, then exits 2.
        # The counter lives only that minute. A restart that bootstraps from a newer round
        # skips the divergent tick and never diverges again (runbook), so the ticket must
        # outlive the process: any non-zero sample in the last 6 h keeps it firing.
        # (Corrected at §8, 2026-09-24. It resolved after about a minute before.)
        expr: max_over_time(andara_state_digest_mismatches_total[6h]) > 0
        labels:
          severity: ticket
          slo: projection-freshness
          projection: state
        annotations:
          summary: "The state projector's replica disagreed with the World's recorded State Hash — a possible determinism failure; the evidence is the projector's error line"
          runbook: docs/runbooks/state-projector-diverged.md
      - alert: ProjectionStale
        # Only while the World is ticking (the SLO's measurement condition). A server that
        # has stopped produces no boundaries, and the projector's lag grows without anything
        # being stale; that is AndaraServerUnavailable's or SimulationLagging's to report.
        # `on (environment, namespace)` matches the cluster's per-environment series, and
        # matches the label-less compose ones to each other.
        expr: |
          (andara_state_projector_lag_seconds > andara_state_projector_lag_budget_seconds)
            and on (environment, namespace) (sum by (environment, namespace) (rate(andara_ticks_total[5m])) > 0)
        for: 5m
        labels:
          severity: ticket
          slo: projection-freshness
          projection: state
        annotations:
          summary: "The state projection is behind the World by more than its lag budget for 5 minutes"
          runbook: docs/runbooks/projection-stale.md
      - alert: StateProjectorDown
        # AW-INF-025. The projector's Deployment wants a replica and no ready projector pod
        # is scraped. `make projector-stop` and `projector-rebuild` scale it to 0, so a
        # planned stop never fires; a crash loop or an unready pod drops out of the
        # annotation scrape and does. Keyed on desired replicas, not absent(): an environment
        # with the projector disabled has no Deployment and no series, and compose has no
        # kube_* series at all.
        expr: |
          max by (environment, namespace) (kube_deployment_spec_replicas{deployment="andara-projector-state"}) > 0
            unless on (environment, namespace) max by (environment, namespace) (up{job="andara-projector-state"} == 1)
        for: 10m
        labels:
          severity: ticket
          slo: projection-freshness
          projection: state
        annotations:
          summary: "The state projector should be running and no ready projector pod has been scraped for 10 minutes"
          runbook: docs/runbooks/state-projector-down.md
  - name: andara-content
    # AW-SRV-012, tied to docs/specs/slo/content-freshness.md. A pointer move the World has
    # not served for five minutes, for a system reason; a version refused for a Builder's
    # mistake returns the gauge to 0 and never fires this. Ticket: players keep the previous
    # version, whole. Per pack and, on the cluster, per namespace, with no aggregation across
    # either.
    rules:
      - alert: ContentLoadFailing
        expr: max by (environment, namespace, pack) (andara_content_pending_seconds) > 300
        for: 5m
        labels:
          severity: ticket
          slo: content-freshness
        annotations:
          summary: "Published content has not gone live for over five minutes — the previous version is still serving"
          runbook: docs/runbooks/content-load-failing.md
  - name: andara-sessions
    # The Event stream (AW-SRV-011). One alert, on the symptom: players' streams are being
    # ended by the server faster than the Session availability budget allows
    # (docs/specs/slo/session-availability.md). client_gone is the player leaving and is
    # not a drop. The target is 99.5 % over 28 days (Brian, 2026-09-20).
    rules:
      - alert: SessionsDroppingAtRate
        # A ratio across Sessions, so both sides are summed — by environment and namespace, or
        # one environment's streams would be diluted by another's.
        expr: |
          sum by (environment, namespace) (rate(andara_session_egress_drops_total{reason=~"buffer_full|draining"}[5m])) * 60
            > 0.01 * sum by (environment, namespace) (avg_over_time(andara_stream_subscribers[5m]))
        for: 5m
        labels:
          severity: page
          slo: session-availability
        annotations:
          summary: "Server-ended Event streams above 1% of open streams per minute for 5 minutes — players are losing the World"
          runbook: docs/runbooks/sessions-dropping.md
  - name: andara-edge
    # The edge (AW-INF-006): Traefik in front, cert-manager underneath. Both are cluster
    # services the observability stack scrapes (EPIC-07); in the compose stack neither
    # series exists and these rules stay silent rather than fire on absence — an absent
    # edge is AndaraServerUnavailable's job, not a second page.
    rules:
      - alert: CertificateExpiringSoon
        # cert-manager's own view of every Certificate this chart issues. Below 7 d is a
        # renewal that did not happen: renewBefore is 10 d, so a healthy issuer has
        # already replaced it by now.
        #
        # The Certificate's namespace is a label on cert-manager's own series. The cluster
        # scrapes cert-manager with its pod's namespace as the target's `namespace` and
        # without honor_labels, so the Certificate's arrives as `exported_namespace`; it is
        # put back where the summary and routing read it. Where there is no
        # exported_namespace the regex does not match and `namespace` is left as it is.
        #
        # The series' `environment` is cert-manager's own namespace's (`unknown`, outside
        # decision 9's table), so it is derived from that `namespace` the same way, one
        # label_replace per environment of the table. A Certificate in a namespace outside
        # the table (`andara-ca`, in cert-manager's) keeps the `environment` it arrived with,
        # `unknown` or none, and routes through the root receiver to Slack, never IRM.
        expr: |
          (
            label_replace(label_replace(label_replace(label_replace(
              label_replace(certmanager_certificate_expiration_timestamp_seconds{name=~"andara-.*"},
                            "namespace", "$1", "exported_namespace", "(.+)"),
              "environment", "local", "namespace", "andara-local|andara-ci"),
              "environment", "dev", "namespace", "andara-dev"),
              "environment", "staging", "namespace", "andara-staging"),
              "environment", "prod", "namespace", "andara-prod")
            - time()
          ) < 7 * 24 * 3600
        for: 15m
        labels:
          severity: page
          slo: edge-availability
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days and has not renewed"
          runbook: docs/runbooks/certificate-expiring.md
      - alert: IngressErrorRateHigh
        # Router-level, not service-level: a request Traefik cannot forward (no ready
        # endpoint, backend TLS verification failed) is counted on the router and never
        # reaches a service counter. gRPC-protocol responses carry code="2" in Traefik
        # 3.7 whatever happened, so this ratio sees Connect and gRPC-Web clients; the
        # gRPC leg is covered from the server side by AndaraServerUnavailable.
        #
        # Traefik's series carry Traefik's namespace. The environment is in the router
        # name instead — Traefik names an Ingress router `<namespace>-<ingress>-<host>…`,
        # and both Andara Ingresses are named `andara…` — so it is lifted out of there
        # before the ratio is taken per environment. `make stream-soak` asserts a non-zero
        # count on `router="<namespace>-andara-…"` on every kind run, which is what keeps
        # that naming observed rather than assumed. (An Ingress that names no entrypoint
        # gets one router per entrypoint, prefixed `websecure-…`; the chart always names
        # one.) The environment follows from that namespace by decision 9's table, in both the
        # numerator and the denominator, before either is summed.
        expr: |
          (
            sum by (environment, namespace) (
              label_replace(label_replace(label_replace(label_replace(
                label_replace(rate(traefik_router_requests_total{router=~"andara-.*", code=~"5.."}[10m]),
                              "namespace", "$1", "router", "(andara-[a-z0-9]+)-andara.*"),
                "environment", "local", "namespace", "andara-local|andara-ci"),
                "environment", "dev", "namespace", "andara-dev"),
                "environment", "staging", "namespace", "andara-staging"),
                "environment", "prod", "namespace", "andara-prod"))
            /
            sum by (environment, namespace) (
              label_replace(label_replace(label_replace(label_replace(
                label_replace(rate(traefik_router_requests_total{router=~"andara-.*"}[10m]),
                              "namespace", "$1", "router", "(andara-[a-z0-9]+)-andara.*"),
                "environment", "local", "namespace", "andara-local|andara-ci"),
                "environment", "dev", "namespace", "andara-dev"),
                "environment", "staging", "namespace", "andara-staging"),
                "environment", "prod", "namespace", "andara-prod"))
          ) > 0.01
        for: 10m
        labels:
          severity: page
          slo: edge-availability
        annotations:
          summary: "More than 1% of requests through the Andara edge are 5xx for 10 minutes"
          runbook: docs/runbooks/ingress-error-rate.md
