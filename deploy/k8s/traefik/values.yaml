# Traefik's values for `make platform-up` (AW-INF-054), at the chart version pinned in
# deploy/platform/versions.yaml. platform-up adds one value per machine, never committed:
# ports.websecure.proxyProtocol.trustedIPs, the kind network's IPv4 gateway as a /32 (ADR-0013
# decision 11). The web entrypoint trusts no PROXY header. The parts the chart (AW-INF-006)
# depends on: hostPort :80/:443 on the ingress-ready node, `traefik` as the default
# IngressClass, the CRD provider (ServersTransport, Middleware), Prometheus metrics with
# router and service labels (the IngressErrorRateHigh alert reads them), JSON access logs.
# One difference from the box: the Gateway API provider is off, because nothing here
# uses it and enabling it needs the Gateway CRDs installed first.
deployment:
  replicas: 1
  # The k8s-monitoring chart's annotation autodiscovery reads `job` from this annotation, beside the
  # prometheus.io/* ones the chart sets for its metrics port (ADR-0014 amendment A2, AW-INF-065).
  podAnnotations:
    k8s.grafana.com/job: traefik
updateStrategy:
  type: Recreate
  rollingUpdate: null
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
service:
  spec:
    type: ClusterIP
ports:
  web:
    port: 8000
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    hostPort: 443
    http:
      tls:
        enabled: true
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: false
gateway:
  enabled: false
metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true
log:
  format: json
  level: INFO
accessLog:
  enabled: true
  format: json
