# The command log for the box's Andara environments: Apache Kafka via Strimzi (AW-INF-014),
# shared by andara-local and andara-dev (ADR-0013 decisions 3–5, AW-INF-055).
#
# ADR-0002 §7 puts Kafka in production and Redpanda only on a laptop; dev and prod on the
# box are the production path, so this is Kafka (decided 2026-09-24, Brian). One cluster, in
# the namespace andara-shared: `make shared-up` applies this file unchanged with
# `kubectl -n andara-shared apply`, so nothing here names a namespace. The environments are
# kept apart by topic prefix (`local.`, `dev.`, deploy/kafka/topics.yaml) and by
# per-environment SCRAM principals whose ACLs are scoped to the prefix (AW-INF-056). Clients
# reach it as andara-log-kafka-bootstrap.andara-shared.svc:9092, with their own credential.
#
# What sharing costs (ADR-0013): one environment can fill the brokers' disks or exhaust their
# partitions or connections, and a broker fault disturbs both. local's topics carry a size and
# age bound (topics.yaml), and `make shared-check` reports each PVC's use and each prefix's
# bytes.
#
# Three combined controller+broker nodes, because deploy/kafka/topics.yaml declares
# replication factor 3 and min.insync.replicas 2 for dev and prod: one broker can be lost
# with writes still acknowledged by two (`make kafka-broker-bounce`, AC-5). They spread over
# the three kind workers; the box is one host, so this buys process and node failure, not
# host failure.
#
# Topics are not declared here. deploy/kafka/topics.yaml is the one declaration
# (AW-INF-004), applied by `scripts/topics.py` through the rpk toolbox in tools.yaml, so
# there is no Topic Operator and no KafkaTopic to disagree with it.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: andara-log
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 20Gi
    class: standard
    # The environment's Command history. Deleting the Kafka must not delete it; losing it
    # is not recoverable from snapshot rounds (ADR-0002).
    deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      # So a broker's page cache cannot starve the server scheduled beside it.
      memory: 2Gi
  jvmOptions:
    "-Xms": 1g
    "-Xmx": 1g
  template:
    pod:
      metadata:
        annotations:
          # Scraped by the platform's Alloy like the server (AW-INF-008): the Strimzi
          # Metrics Reporter serves Prometheus text on 9404.
          prometheus.io/scrape: "true"
          prometheus.io/port: "9404"
          prometheus.io/path: /metrics
          k8s.grafana.com/job: andara-kafka
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: andara-log
                  strimzi.io/pool-name: broker
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: andara-log
spec:
  kafka:
    version: 4.3.1
    listeners:
      # Every client authenticates with SCRAM-SHA-512 and is held to its KafkaUser's ACLs
      # (ADR-0011, as ADR-0013 decision 6 amends it; AW-INF-056). There is no unauthenticated
      # listener: `make kafka-users-check` fails on one (AC-8). Port 9092 is the one clients have
      # always used; only its authentication changed. No TLS: traffic never leaves the cluster
      # (ADR-0013, accepted by Brian 2026-10-10).
      - name: scram
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
        # Strimzi renders this into the listener's NetworkPolicy. Each peer is ORed with the
        # others; within a peer the namespaceSelector and podSelector are ANDed. So: the
        # server and projector pods (the chart's app.kubernetes.io/name: andara) in a namespace
        # labelled andara.valesor/env local or dev, which `make shared-up` labels; the rpk
        # toolbox in andara-shared; and the brokers themselves, because tools run in a broker
        # pod reach the other brokers on this listener: `make shared-check`'s kafka-log-dirs
        # and `make kafka-broker-bounce`'s kafka-topics --under-replicated-partitions (Strimzi
        # admits broker-to-broker traffic on its own internal ports only); and the schema
        # registry in andara-shared, which keeps its schemas in _schemas (AW-INF-057). Nothing
        # else, including an `andara` pod in an unlabelled namespace: it is refused before SASL
        # (AW-INF-056 AC-7). The broker-pod tools authenticate as andara-operator too.
        networkPolicyPeers:
          - namespaceSelector:
              matchExpressions:
                - key: andara.valesor/env
                  operator: In
                  values: [local, dev]
            podSelector:
              matchLabels:
                app.kubernetes.io/name: andara
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: andara-kafka-tools
          - podSelector:
              matchLabels:
                strimzi.io/cluster: andara-log
                strimzi.io/pool-name: broker
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: andara-schema-registry
    # Deny by default: a principal does exactly what its KafkaUser's ACLs grant. The one
    # superuser is the operator's, declared in topics.yaml (`superuser: true`), which
    # `make kafka-users-check` holds this list to (AC-14). Strimzi adds the brokers' own
    # principals itself.
    authorization:
      type: simple
      superUsers:
        - andara-operator
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # topics.yaml's broker.assert: an out-of-sync replica must never become leader, or
      # acks=all stops meaning durable (docs/specs/slo/recovery.md).
      unclean.leader.election.enable: false
      # Every topic comes from topics.yaml; a typo in a client must not create one.
      auto.create.topics.enable: false
    metricsConfig:
      type: strimziMetricsReporter
      values:
        # Broker health without per-partition series: replication, controller, request
        # and per-topic rates. AW-INF-005's alerts read these.
        allowList:
          - "kafka_server_replicamanager_.*"
          - "kafka_controller_.*"
          - "kafka_server_brokertopicmetrics_.*"
          - "kafka_server_kafkaserver_.*"
          - "kafka_network_requestmetrics_requests_total.*"
          # AW-INF-056: failed SASL authentications on the listener, and the quota throttle time of
          # each principal (labelled by user, bounded by the KafkaUser set). Read from the broker's
          # own endpoint in the drill, not through gcx: the keep pipeline drops them (AW-INF-051).
          - "kafka_server_socket_server_metrics_failed_authentication.*"
          - "kafka_server_produce_throttle_time.*"
          - "kafka_server_fetch_throttle_time.*"
  # The User Operator only (ADR-0011 decision 5): it turns the KafkaUsers rendered from
  # topics.yaml into SCRAM credentials (a Secret per principal, here in andara-shared) and
  # ACLs. The Topic Operator stays out; topics.yaml is applied by scripts/topics.py.
  entityOperator:
    userOperator: {}
