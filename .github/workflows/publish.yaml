# Publish the server image on every merge to main (AW-INF-013): ghcr.io/valesordev/andara-server
# as :sha-<12 hex>, immutable, and :dev, which values/dev.yaml pulls. The build is
# `make image-publish` and the proof is `make image-check`, so this file only logs in.
#
# Then andara-cli (AW-INF-020): `make cli-release` builds the five archives, and
# `make cli-release-publish` attaches them to the rolling `cli-dev` pre-release, which Builders
# and the Content Repository's CI download. `v*` tags are release.yaml's.

name: publish

# main only, never a pull request: a PR from a fork cannot write packages, and one from a
# branch must not publish what has not merged (AC-5).
on:
  push:
    branches: [main]

# One run at a time. GitHub serializes a group but does not order it, so what keeps :dev
# on the newest commit is image_publish.sh moving :dev only when its commit is still main's
# head (AC-6). GitHub keeps one pending run per group, so a commit whose run is replaced
# while queued gets no sha- tag; dev still converges.
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION is `git describe --tags`, which needs the tags.
          fetch-depth: 0

      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push
        run: make image-publish

      # AC-2 from the outside, immediately: a package GitHub created private fails here,
      # naming the fix, rather than at the box's next pull.
      - name: anonymous pull
        run: make image-check REGISTRY_ONLY=1 TAG="sha-$(git rev-parse --short=12 HEAD)"

  cli:
    # After the image, so `cli-dev` never names a commit whose `:dev` image failed to publish.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Moving the cli-dev tag and editing its release.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make cli-release

      # Moves cli-dev only if this commit is still main's head (AC-2), and writes the job
      # summary: the commit cli-dev carries and each archive's checksum.
      - name: publish cli-dev
        run: make cli-release-publish TAG=cli-dev

      # AC-3 from the outside, with no credentials, and AC-1: what downloads is the commit the
      # cli-dev tag names. When a newer merge's run owns the tag, that's its commit.
      - name: anonymous download
        run: |
          out="$(env -u GH_TOKEN make cli-release-check)"
          echo "$out"
          tagged="$(git ls-remote origin refs/tags/cli-dev | cut -c1-7)"
          grep -q "(${tagged}" <<<"$out" || { echo "::error::cli-dev's binary does not report the commit its tag names (${tagged})"; exit 1; }
