# CI runs `make check` and nothing else, so a green CI and a green local run
# cannot disagree (AW-INF-001, AC-13).

name: check

# `pull_request` covers every branch that is going anywhere; `push` is narrowed to main
# so a branch with an open PR does not run this twice for one commit. The cost is that a
# branch pushed with no PR open runs nothing — open the PR to get CI.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` compares against main (AW-SRV-020), and the default
          # shallow clone fetches only the tested ref — main would be absent and
          # the check would skip itself into a vacuous pass.
          fetch-depth: 0

      - name: make main available for the breaking-change check
        run: git fetch origin main:main || echo "no origin/main yet"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bootstrap
        run: make bootstrap

      # AC-13 says CI runs `make check` and no other build logic. It enumerates the
      # sub-targets instead, for the named-step diagnosability the story's observability
      # section requires — which means two lists that can drift, and did: `status-check`
      # was added to `make check` and CI never noticed. The Makefile is the source of
      # truth; this asserts the workflow matches it.
      - name: ci parity with `make check`
        run: |
          rc=0
          for t in $(make check-targets); do
            grep -q "run: make $t" .github/workflows/ci.yaml || {
              echo "::error file=.github/workflows/ci.yaml::make check runs '$t' but this workflow has no step for it"
              rc=1
            }
          done
          exit $rc

      # Sub-steps are named individually so a red build is diagnosable from the
      # summary view without opening logs (AW-INF-001, observability section).
      - name: fmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: proto freshness
        run: make proto-check
      - name: validate-stories
        run: make validate-stories
      - name: backlog freshness
        run: make backlog-check
      - name: status freshness
        run: make status-check
      - name: k8s-dry
        run: make k8s-dry ENV=dev
