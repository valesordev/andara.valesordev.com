# CI runs `make check` and nothing else, so a green CI and a green local run
# cannot disagree (AW-INF-001, AC-13).

name: check

# `pull_request` covers every branch that is going anywhere; `push` is narrowed to main
# so a branch with an open PR does not run this twice for one commit. The cost is that a
# branch pushed with no PR open runs nothing — open the PR to get CI.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` compares against main (AW-SRV-020), and the default
          # shallow clone fetches only the tested ref — main would be absent and
          # the check would skip itself into a vacuous pass.
          fetch-depth: 0

      - name: make main available for the breaking-change check
        run: git fetch origin main:main || echo "no origin/main yet"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bootstrap
        run: make bootstrap

      # AC-13 says CI runs `make check` and no other build logic. It enumerates the
      # sub-targets instead, for the named-step diagnosability the story's observability
      # section requires — which means two lists that can drift, and did: `status-check`
      # was added to `make check` and CI never noticed. The Makefile is the source of
      # truth; this asserts the workflow matches it.
      - name: ci parity with `make check`
        run: |
          rc=0
          for t in $(make check-targets); do
            grep -q "run: make $t" .github/workflows/ci.yaml || {
              echo "::error file=.github/workflows/ci.yaml::make check runs '$t' but this workflow has no step for it"
              rc=1
            }
          done
          exit $rc

      # Sub-steps are named individually so a red build is diagnosable from the
      # summary view without opening logs (AW-INF-001, observability section).
      - name: fmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: proto freshness
        run: make proto-check
      - name: subject declaration
        run: make schemas-check
      - name: validate-stories
        run: make validate-stories
      # Render checks, not freshness checks: neither view is committed (AW-INF-026).
      - name: backlog render
        run: make backlog-check
      - name: status render
        run: make status-check
      - name: values schema freshness
        run: make values-schema-check
      - name: k8s-dry
        run: make k8s-dry
      - name: helm-test
        run: make helm-test
      - name: license-check
        run: make license-check
      - name: content-language corpus
        run: make content-grammar-check
      - name: content-language conformance
        run: make content-conformance
      - name: scripts unit tests
        run: make scripts-test
      # AW-INF-029. On a pull request the merge base with origin/main comes from
      # fetch-depth: 0 above. On a push to main it compares with the commit main was at before
      # the push, so a multi-commit push, or a merge whose own run this group cancelled, is
      # checked whole. A force-push whose `before` is gone exits 2, loudly.
      - name: core VERSIONS append-only
        run: make core-versions-check
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
      # The views as of this commit, since neither is committed (AW-INF-026, AC-4).
      - name: status and backlog in the summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          { echo '## Status'; echo; echo '```'; make -s status; echo '```'; echo; make -s backlog; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-conformance
          path: content-conformance.json
          if-no-files-found: ignore

  # AW-INF-020 AC-6: every pull request builds the five andara-cli archives a merge would
  # publish, and publishes nothing (this workflow has no write permission). AC-7: the
  # linux/amd64 binary runs `content fmt --check` in a busybox container, which has no Go
  # toolchain and no libc, so a dynamic link or a toolchain dependency fails here.
  cli-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION is `git describe --tags`, which needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build the five archives
        run: make cli-release
      - name: linux/amd64 runs with no Go toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          tar -C "$RUNNER_TEMP/cli" -xzf dist/andara-cli_*_linux_amd64.tar.gz
          docker run --rm -v "$RUNNER_TEMP/cli:/cli:ro" -v "$PWD/docs/specs/content-language/v1/corpus:/corpus:ro" \
            busybox:stable /cli/andara-cli content fmt --check --path /corpus/valid/town

  # AW-SRV-002 AC-3 and its Definition of Done: replay equality and the golden State Hash
  # sequence run on every architecture a replica or a developer might be, and a
  # determinism regression cannot merge. darwin/arm64 is a real macOS runner, not an
  # emulation; linux/arm64 is the runner the chart would land on if the cluster were.
  # These are a subset of `make test` — they run there too — repeated here per platform.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: replay equality and golden hashes on ${{ runner.os }}/${{ runner.arch }}
        run: make test-determinism
