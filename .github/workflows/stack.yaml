# Local-stack integration check (AW-INF-002 test plan).
#
# Separate from `check` deliberately: `make check` must stay fast and must not require a
# container runtime, but a stack that only ever comes up on developer machines is a stack
# that breaks on the next image bump and nobody notices until onboarding day.
#
# What this cannot assert yet: TLS from `andara-cli`, real spans, and read-only
# degradation. All three need a server (AW-SRV-005, AW-SRV-010) and are named as pending
# in the story's verification record rather than quietly skipped here.

name: stack

# Same two-trigger split as `check`, plus the path filter repeated on `pull_request`.
# Without it every PR paid three minutes to boot a stack it had not touched — `push` was
# filtered and `pull_request` was not, which reads as filtered and is not.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/stack.sh"
      - "scripts/tls.sh"
      - "scripts/topics.py"
      - "scripts/schemas.py"
      - "deploy/kafka/**"
      - ".github/workflows/stack.yaml"
  pull_request:
    # Repeated rather than a YAML anchor: GitHub Actions' parser does not expand aliases.
    paths:
      - "deploy/**"
      - "scripts/stack.sh"
      - "scripts/tls.sh"
      - "scripts/topics.py"
      - "scripts/schemas.py"
      - "deploy/kafka/**"
      - ".github/workflows/stack.yaml"
  schedule:
    # Weekly, because the thing most likely to break this is an upstream image, not a commit.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bootstrap
        run: make bootstrap

      - name: up
        run: make up

      - name: topics match the declaration
        run: make topics-diff

      # AC-6 and AC-7 live here rather than in `check`, because they are the questions git
      # cannot answer — what is actually registered — and answering them needs a registry.
      # `make up` already registered the subjects; this proves the registry agrees with the
      # declaration, and that a second apply changes nothing.
      - name: subjects are registered and match the declaration
        run: |
          set -euo pipefail
          make schemas-diff
          make schemas-apply | tail -1 | grep -q '0 newly registered' \
            || { echo "schemas-apply is not idempotent"; exit 1; }

      - name: build info and scrape targets are up
        run: |
          set -euo pipefail
          curl -sf "http://localhost:${ANDARA_METRICS_PORT:-9090}/api/v1/targets" \
            | python3 -c "
          import json, sys
          targets = json.load(sys.stdin)['data']['activeTargets']
          up = {t['labels']['job']: t['health'] for t in targets}
          print(up)
          # andara-server is expected down until AW-SRV-005 lands; everything else must be up.
          for job in ('otel-collector', 'redpanda'):
              assert up.get(job) == 'up', '%s is %s' % (job, up.get(job))
          "

      - name: a trace round-trips through the collector
        run: |
          set -euo pipefail
          TRACE=$(python3 -c "import os; print(os.urandom(16).hex())")
          SPAN=$(python3 -c "import os; print(os.urandom(8).hex())")
          NOW=$(python3 -c "import time; print(int(time.time()*1e9))")
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"andara-server\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$TRACE\",\"spanId\":\"$SPAN\",\"name\":\"command.execute\",\"kind\":2,\"startTimeUnixNano\":\"$NOW\",\"endTimeUnixNano\":\"$((NOW+1000000))\"}]}]}]}" \
            "http://localhost:${ANDARA_OTLP_HTTP_PORT:-4318}/v1/traces"
          for i in $(seq 1 20); do
            if docker compose -f deploy/compose/docker-compose.yaml exec -T tempo \
                 wget -qO- "http://localhost:3200/api/traces/$TRACE" | grep -q command.execute; then
              echo "trace $TRACE retrievable"; exit 0
            fi
            sleep 3
          done
          echo "trace $TRACE never became retrievable" >&2; exit 1

      - name: the dashboard is provisioned, not clicked together
        run: |
          set -euo pipefail
          curl -sf "http://localhost:${ANDARA_DASHBOARD_PORT:-3000}/api/dashboards/uid/andara-tick-health" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['dashboard']
          assert len(d['panels']) >= 6, d['panels']
          print(d['title'], '-', len(d['panels']), 'panels')
          "

      - name: down leaves nothing behind
        run: |
          set -euo pipefail
          make down VOLUMES=1
          test -z "$(docker ps -aq --filter name=andara)" || { docker ps -a --filter name=andara; exit 1; }
          test -z "$(docker volume ls -q --filter name=andara)" || { docker volume ls --filter name=andara; exit 1; }
          echo "no residual containers or volumes"

      - name: diagnostics on failure
        if: failure()
        run: make ps || true; docker compose -f deploy/compose/docker-compose.yaml logs --tail=100 || true
