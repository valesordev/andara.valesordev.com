# Local-stack integration check (AW-INF-002 test plan).
#
# Separate from `check` deliberately: `make check` must stay fast and must not require a
# container runtime, but a stack that only ever comes up on developer machines is a stack
# that breaks on the next image bump and nobody notices until onboarding day.
#
# What this cannot assert yet: TLS from `andara-cli`, real spans, and read-only
# degradation. All three need a server (AW-SRV-005, AW-SRV-010) and are named as pending
# in the story's verification record rather than quietly skipped here.

name: stack

# Same two-trigger split as `check`, plus the path filter repeated on `pull_request`.
# Without it every PR paid three minutes to boot a stack it had not touched — `push` was
# filtered and `pull_request` was not, which reads as filtered and is not.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/stack.sh"
      # `make up` takes its stamps from the Makefile and passes them to stack.sh (AW-INF-016),
      # so a Makefile change can break what "the server runs this commit" asserts.
      - "Makefile"
      - "scripts/stack_smoke.sh"
      - "scripts/stack_play.sh"
      - "scripts/stack_linkdead.sh"
      - "scripts/stack_boundary_lost.sh"
      - "scripts/stack_projector_check.sh"
      - "scripts/tls.sh"
      - "scripts/auth_keys.sh"
      - "scripts/topics.py"
      - "scripts/schemas.py"
      - "deploy/kafka/**"
      - ".github/workflows/stack.yaml"
      # The server is part of the stack since AW-SRV-005, and the account store talks to
      # the broker since AW-SRV-008; a Go change can break what only this workflow checks.
      # andara-cli plays against it since AW-CLI-004.
      - "server/**"
      - "admin/**"
      - "cmd/**"
      - "internal/**"
      - "gen/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    # Repeated rather than a YAML anchor: GitHub Actions' parser does not expand aliases.
    paths:
      - "deploy/**"
      - "scripts/stack.sh"
      - "Makefile"
      - "scripts/stack_smoke.sh"
      - "scripts/stack_play.sh"
      - "scripts/stack_linkdead.sh"
      - "scripts/stack_boundary_lost.sh"
      - "scripts/stack_projector_check.sh"
      - "scripts/tls.sh"
      - "scripts/auth_keys.sh"
      - "scripts/topics.py"
      - "scripts/schemas.py"
      - "deploy/kafka/**"
      - ".github/workflows/stack.yaml"
      - "server/**"
      - "admin/**"
      - "cmd/**"
      - "internal/**"
      - "gen/**"
      - "go.mod"
      - "go.sum"
  schedule:
    # Weekly, because the thing most likely to break this is an upstream image, not a commit.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bootstrap
        run: make bootstrap

      - name: up
        run: make up | tee "$RUNNER_TEMP/up.log"

      # AW-INF-016: `make up` builds the server from the tree it runs in, stamped the way
      # `make image` stamps it. The runner starts with no image, so this can't catch a stale
      # one. What it catches is a stamp that drifts: the summary, the container label and
      # andara_build_info{commit} must all name this commit, clean. The metric is polled,
      # because `--wait` sees /readyz, not a scrape (live-assertions.md).
      - name: the server runs this commit
        run: |
          set -euo pipefail
          want="${{ github.sha }}"
          grep -E "^  andara-server revision +${want}\$" "$RUNNER_TEMP/up.log"
          [[ "$(scripts/stack.sh revision)" == "$want" ]]
          commit=""
          for _ in $(seq 30); do
            commit="$(curl -sf "http://127.0.0.1:${ANDARA_HTTP_PORT:-8080}/metrics" \
              | sed -n 's/^andara_build_info{.*commit="\([^"]*\)".*/\1/p' || true)"
            [[ -n "$commit" ]] && break
            sleep 1
          done
          echo "revision=$want build_info.commit=$commit"
          [[ -n "$commit" && "$commit" != unknown && "$commit" != *-dirty && "$want" == "$commit"* ]]

      - name: topics match the declaration
        run: make topics-diff

      # AW-INF-018: topics-apply aligns an existing topic's config, and refuses a change that
      # can delete data until the operator names the topic. This runner's topics hold
      # nothing, which is the only reason the step may move a live retention by hand:
      # lowering one is the destructive act the target guards, so it's never done to a
      # developer's stack or the box. andara.audit.v1 declares 365 days.
      - name: topics-apply aligns drift and refuses data loss
        run: |
          set -euo pipefail
          rpk() { docker compose -f deploy/compose/docker-compose.yaml exec -T redpanda rpk "$@"; }
          live() { rpk topic describe andara.audit.v1 -c | awk '$1 == "retention.ms" { print $2 }'; }
          declared=31536000000
          # Live below the declaration: applying it widens the window, so it just applies.
          rpk topic alter-config andara.audit.v1 --set retention.ms=86400000
          make topics-apply | tee "$RUNNER_TEMP/apply.log"
          grep -qx "topics: altered andara.audit.v1 retention.ms 86400000 -> $declared" "$RUNNER_TEMP/apply.log"
          [[ "$(live)" == "$declared" ]]
          make topics-diff
          # Live above it: applying it narrows the window, which is refused, changing nothing.
          rpk topic alter-config andara.audit.v1 --set retention.ms=63072000000
          if make topics-apply 2>"$RUNNER_TEMP/refused.log"; then
            echo "topics-apply applied a retention decrease without ALLOW_DATA_LOSS"; exit 1
          fi
          grep -q "re-run with ALLOW_DATA_LOSS=andara.audit.v1" "$RUNNER_TEMP/refused.log"
          [[ "$(live)" == 63072000000 ]]
          # Named, it applies, and says so.
          make topics-apply ALLOW_DATA_LOSS=andara.audit.v1 > "$RUNNER_TEMP/accepted.log"
          grep -q '^topics: altered andara.audit.v1 retention.ms 63072000000 -> [0-9]* (data loss accepted)$' "$RUNNER_TEMP/accepted.log"
          [[ "$(live)" == "$declared" ]]
          make topics-diff

      # AC-6 and AC-7 live here rather than in `check`, because they are the questions git
      # cannot answer — what is actually registered — and answering them needs a registry.
      # `make up` already registered the subjects; this proves the registry agrees with the
      # declaration, and that a second apply changes nothing.
      - name: subjects are registered and match the declaration
        run: |
          set -euo pipefail
          make schemas-diff
          make schemas-apply | tail -1 | grep -q '0 newly registered' \
            || { echo "schemas-apply is not idempotent"; exit 1; }

      - name: build info and scrape targets are up
        run: |
          set -euo pipefail
          curl -sf "http://localhost:${ANDARA_METRICS_PORT:-9090}/api/v1/targets" \
            | python3 -c "
          import json, sys
          targets = json.load(sys.stdin)['data']['activeTargets']
          up = {t['labels']['job']: t['health'] for t in targets}
          print(up)
          for job in ('andara-server', 'otel-collector', 'redpanda'):
              assert up.get(job) == 'up', '%s is %s' % (job, up.get(job))
          "

      # AW-SRV-005 §8: instrumentation must be verified against a real backend, not just
      # registered. The gateway's Go tests read a Prometheus registry in-process, which proves
      # the counters move but not that anything scrapes them. This opens a Session on the
      # running server over TLS and then asks Prometheus what it saw.
      #
      # It also covers the story's manual/operator test plan, which until now was a grpcurl
      # sequence in a markdown file that nothing ran (CLAUDE.md §9).
      - name: a Session opens over TLS and Prometheus sees it
        run: make stack-smoke

      # AW-SRV-008's record-log adapter and AW-SRV-002's tick loop against the real
      # broker, on throwaway topics: append and replay; apply, then replay from the
      # recorded boundaries; kill a loop with SIGKILL and recover the next one from the
      # boundaries it left.
      #
      # Also AW-SRV-006's s3 snapshot store against the stack's MinIO. server/store is in
      # this target rather than `make test` because `make test` has no stack behind it:
      # s3_test.go skips without ANDARA_S3_TEST_ENDPOINT, and s3 is what snapshot.store=s3
      # selects in the cluster, so this is the only run that executes the production
      # snapshot path.
      - name: the record log and the tick loop on the broker
        run: make test-integration
        env:
          ANDARA_S3_TEST_ENDPOINT: localhost:${{ env.ANDARA_S3_PORT || '19000' }}
          ANDARA_S3_TEST_ACCESS_KEY: andaratest
          ANDARA_S3_TEST_SECRET_KEY: andaratest123

      # #74: the compose server's `fs` snapshot store had no writable path, so every round
      # failed `store` and nothing noticed. One complete round, polled to a deadline: the
      # first falls due one snapshot.interval (60 s) after boot, and the server has been up
      # for less than that here, so 150 s is margin, not the expectation.
      - name: a snapshot round completes on the stack
        run: |
          set -euo pipefail
          m() { curl -sf "http://127.0.0.1:${ANDARA_HTTP_PORT:-8080}/metrics" \
            | awk -v k="$1" '$1 == k { print $2 }'; }
          complete=0
          for _ in $(seq 150); do
            complete="$(m 'andara_snapshot_rounds_total{outcome="complete"}' || true)"
            awk -v c="${complete:-0}" 'BEGIN { exit !(c >= 1) }' && break
            sleep 1
          done
          store="$(m 'andara_snapshot_failures_total{reason="store"}')"
          echo "rounds complete=${complete:-0} store_failures=${store:-?}"
          awk -v c="${complete:-0}" 'BEGIN { exit !(c >= 1) }'
          [[ "$store" == "0" ]]
          ls -R .local/data/snapshots | head -20

      # AW-SRV-002 AC-9: the broker goes away and the tick loop keeps its schedule applying
      # nothing — starvation counted, the container still healthy — and when the broker
      # returns the counter stops moving. The loop is read through /metrics because that is
      # what an operator has.
      #
      # "Stops moving" is read as a second sample after the broker is back: the counter
      # must be still between the two. How much it rose between `start redpanda` and the
      # first sample is the broker's boot time plus where the fetch cycle stood when the
      # outage began, which is not the loop's to answer — the same run has landed at 9 and
      # at 31 with nothing changed (the 30-tick bound tripped on 2026-09-21 at 31).
      #
      # The outage sample is polled, not slept (live-assertions.md rule 3): starvation is
      # counted only once the Kafka client notices the broker is gone, and a `sleep 8`
      # sampled before that on #95's run (`starved 0 -> 23 -> 23`). The poll ends when
      # both outage claims hold in one scrape, or at 30 s and lets the asserts report.
      - name: the tick loop survives a broker outage
        run: |
          set -euo pipefail
          # Both counters from ONE scrape. Read separately, a tick starving between the
          # two curls lands in one number and not the other, which quietly weakens the
          # absence asserted below (docs/specs/testing/live-assertions.md rule 3).
          pair() { curl -sf "http://127.0.0.1:${ANDARA_HTTP_PORT:-8080}/metrics" \
            | awk '$1 == "andara_ticks_total" { t = $2 } $1 == "andara_tick_input_starved_total" { s = $2 } END { print t, s }'; }
          gte() { awk -v a="$1" -v b="$2" -v n="$3" 'BEGIN { exit !(a - b >= n) }'; }
          read -r ticks_before starved_before <<<"$(pair)"
          docker compose -f deploy/compose/docker-compose.yaml stop redpanda
          ticks_during=$ticks_before starved=$starved_before
          for _ in $(seq 60); do
            sleep 0.5
            read -r t s <<<"$(pair)"
            [[ -n "$t" && -n "$s" ]] || continue   # a missed scrape is not a verdict
            ticks_during=$t starved=$s
            gte "$s" "$starved_before" 20 && gte "$t" "$ticks_before" 40 && break
          done
          docker compose -f deploy/compose/docker-compose.yaml ps --format '{{.Name}} {{.Health}}' | grep -q 'andara-server-1 healthy'
          docker compose -f deploy/compose/docker-compose.yaml start redpanda
          # A slow broker boot moves the test's clock, not its verdict.
          for _ in $(seq 60); do
            docker compose -f deploy/compose/docker-compose.yaml ps --format '{{.Name}} {{.Health}}' | grep -q 'redpanda-1 healthy' && break
            sleep 1
          done
          # Rejoin is not a fixed duration, so do not spend a fixed sleep on it. The claim
          # below is that starvation STOPS once the broker is back — absence, which cannot
          # be waited for (rule 3). Anchor it: poll until starvation has held still across
          # a full second, which is ten ticks at 10Hz, and only then open the window the
          # assertion covers. A `sleep 8` here was a guess at rejoin latency; on a runner
          # slow enough to still be starving at +8s it sampled mid-outage and the
          # `ss == sa` assertion failed on a healthy stack.
          #
          # The poll also has to carry the `ta - td >= 60` assertion below, which the
          # `sleep 8` used to satisfy by accident: waiting only for starvation to settle
          # can return after one second, and sixty ticks have not happened by then. So
          # both conditions gate the break, and the sample that satisfied them is the one
          # kept — reading `t`/`s` and breaking without assigning them back leaves
          # `ticks_after` a second stale, which is how this failed at 59 ticks.
          read -r prev_t prev_s <<<"$(pair)"
          for _ in $(seq 40); do
            sleep 1
            read -r t s <<<"$(pair)"
            [[ -n "$t" && -n "$s" ]] || continue   # a missed scrape is not a verdict
            if [[ "$s" == "$prev_s" && "$t" != "$prev_t" ]] && gte "$t" "$ticks_during" 60; then
              prev_t=$t prev_s=$s
              break
            fi
            prev_t=$t prev_s=$s
          done
          ticks_after=$prev_t starved_after=$prev_s
          sleep 5
          read -r ticks_settled starved_settled <<<"$(pair)"
          echo "ticks $ticks_before -> $ticks_during -> $ticks_after -> $ticks_settled; starved $starved_before -> $starved -> $starved_after -> $starved_settled"
          python3 - "$ticks_before" "$ticks_during" "$ticks_after" "$ticks_settled" "$starved_before" "$starved" "$starved_after" "$starved_settled" <<'PY'
          import sys
          tb, td, ta, ts, sb, s, sa, ss = map(float, sys.argv[1:])
          assert td - tb >= 40, "the loop stalled while the broker was down"
          assert s - sb >= 20, "no starvation counted during the outage"
          assert ta - td >= 60, "the loop stalled after the broker returned"
          assert ts - ta >= 25, "the loop stalled once the broker was back"
          # Anchored absence: >= 25 ticks ran in this window and a starved tick would
          # have incremented the counter, so "no new starvation" is a claim about ticks
          # that happened rather than about a window nothing was observed in.
          assert ss == sa, "starvation kept rising after the broker returned"
          PY
      # AW-SRV-024 AC-4: the collector goes away for sixty seconds while lines are being
      # written. The server keeps serving, stderr keeps every line, the bounded queue
      # counts what it discards (nothing, at this rate), RSS stays within 10%, and when the
      # collector returns new lines reach Loki — which the smoke asserts again.
      - name: the log exporter survives a collector outage
        run: |
          set -euxo pipefail
          rss() { docker compose -f deploy/compose/docker-compose.yaml --profile full --profile server exec -T andara-server sh -c 'grep VmRSS /proc/1/status' | awk '{print $2}'; }
          export ANDARA_TLS_CA_FILE="$PWD/.local/tls/ca.pem" ANDARA_SMOKE_ADDR="localhost:${ANDARA_GRPC_PORT:-8443}"
          # RSS is compared as the maximum over the same load pattern before and during the
          # outage. A single sample is not a measurement: a Go heap warms for tens of seconds
          # after boot and the scavenger hands pages back between samples, so two point
          # readings can differ by half with nothing behind it.
          before=0
          for _ in 1 2 3; do
            go test -tags smoke -count=1 -run '^TestLive_OpenSession$' ./internal/smoke/ >/dev/null
            sleep 9
            r=$(rss); (( r > before )) && before=$r
          done
          docker compose -f deploy/compose/docker-compose.yaml --profile full stop otel-collector
          during=0
          for _ in 1 2 3 4 5 6; do
            go test -tags smoke -count=1 -run '^TestLive_OpenSession$' ./internal/smoke/ >/dev/null
            sleep 9
            r=$(rss); (( r > during )) && during=$r
          done
          curl -sf "http://127.0.0.1:${ANDARA_HTTP_PORT:-8080}/readyz" >/dev/null
          dropped=$(curl -sf "http://127.0.0.1:${ANDARA_HTTP_PORT:-8080}/metrics" | awk '$1 == "andara_log_export_dropped_total" { print $2 }')
          # Not `logs | grep -q`: grep -q exits on the first match and closes the pipe, `docker
          # compose logs` dies on EPIPE with 255, and pipefail reports that — the step failed
          # exactly when the line was found.
          docker compose -f deploy/compose/docker-compose.yaml --profile full --profile server logs --no-log-prefix andara-server > server.log
          grep -q '"msg":"otlp log export failed"' server.log
          docker compose -f deploy/compose/docker-compose.yaml --profile full start otel-collector
          echo "rss before=${before}kB during=${during}kB dropped=${dropped}"
          python3 -c "import sys; b,d=float('$before'),float('$during'); assert d <= b*1.10, 'RSS grew %.0f%% during the outage' % ((d-b)*100/b)"
          sleep 10
          make stack-smoke

      - name: a trace round-trips through the collector
        run: |
          set -euo pipefail
          TRACE=$(python3 -c "import os; print(os.urandom(16).hex())")
          SPAN=$(python3 -c "import os; print(os.urandom(8).hex())")
          NOW=$(python3 -c "import time; print(int(time.time()*1e9))")
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"andara-server\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$TRACE\",\"spanId\":\"$SPAN\",\"name\":\"command.execute\",\"kind\":2,\"startTimeUnixNano\":\"$NOW\",\"endTimeUnixNano\":\"$((NOW+1000000))\"}]}]}]}" \
            "http://localhost:${ANDARA_OTLP_HTTP_PORT:-4318}/v1/traces"
          for i in $(seq 1 20); do
            if docker compose -f deploy/compose/docker-compose.yaml exec -T tempo \
                 wget -qO- "http://localhost:3200/api/traces/$TRACE" | grep -q command.execute; then
              echo "trace $TRACE retrievable"; exit 0
            fi
            sleep 3
          done
          echo "trace $TRACE never became retrievable" >&2; exit 1

      - name: the dashboard is provisioned, not clicked together
        run: |
          set -euo pipefail
          curl -sf "http://localhost:${ANDARA_DASHBOARD_PORT:-3000}/api/dashboards/uid/andara-tick-health" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['dashboard']
          assert len(d['panels']) >= 6, d['panels']
          print(d['title'], '-', len(d['panels']), 'panels')
          "

      # AW-SRV-026 AC-4: an outage past the 60 s delivery timeout loses a Tick Boundary Record.
      # The server exits 5 once, compose's `restart: on-failure` brings it back, it recovers to
      # the last delivered boundary, and a second, full recovery reads the topic back gapless.
      # The short broker outage above (about 30 s at most, well inside the 60 s delivery
      # timeout) must still see no exit. Here, just before the M1 gate (which restarts the
      # server anyway), so the restarts leave no fresh heap under the collector-outage step's
      # RSS comparison and no reset counter under any step that reads one.
      - name: a lost tick boundary exits into exact recovery
        run: make stack-boundary-lost

      # The M1 gate, scripted (scripts/stack_play.sh). The Protocol half (AW-SRV-014):
      # two players create a Character, enter the World, look, walk north through the
      # broker and the tick, and quit, with the instruments scraped from the server.
      # The client half (AW-CLI-004): andara-cli play — log in, connect, look, north,
      # west, quit — asserting the transcript; play cannot select a Character until
      # AW-CLI-007, so its Intents are refused before the log and that story joins the
      # halves. It restarts andara-server under an open session (AC-7), which resets the
      # server's counters, and it reads only its own before/after deltas, so it can follow
      # the boundary-lost step's restarts.
      - name: the M1 gate against the stack — the Protocol whole, andara-cli play up to AW-CLI-007
        run: make stack-play

      # The linkdead gate, scripted (scripts/stack_linkdead.sh, AW-INF-017): the linkdead
      # slice of M2. A bystander watches a player's `play` get SIGKILLed, reads it go
      # linkdead and sees the marker in look, then reads the same Character reconnect
      # with its body never gone, and a clean quit after. The server's linkdead gauge and
      # outcome counters are read before and after, so it follows the M1 gate's restart;
      # before the alert step, which stops the server.
      - name: the linkdead gate against the stack — drop, linkdead, reconnect, quit
        run: make stack-linkdead

      # AW-SRV-043 §7: the projector's restore series, log line and spans, on the stack's own
      # snapshot rounds. The compose has no projector, so the host binary is the only writer
      # on its consumer group and `--rebuild` is safe. After the linkdead gate, which leaves
      # the server running and rounds written.
      - name: the projector's restore instrumentation against the stack
        run: make stack-projector-check

      # AW-INF-008 AC-5, the compose half. The rule file the chart ships is the one this
      # Prometheus mounts, and it was rewritten per namespace; here it must still load with
      # every rule healthy, and AndaraServerUnavailable must still follow the server — the
      # AW-INF-003 `docker stop` check, which until now was a line in a verification record.
      # The rules have been evaluating since `make up`, so `health: ok` is a verdict, not a
      # race. After the M1 gate because it stops the server; nothing after it reads a
      # counter. Both transitions are polled to a deadline, never read once
      # (docs/specs/testing/live-assertions.md).
      - name: the alert rules load and AndaraServerUnavailable follows the server
        run: |
          set -euo pipefail
          prom="http://localhost:${ANDARA_METRICS_PORT:-9090}"
          compose="docker compose -f deploy/compose/docker-compose.yaml --profile full --profile server"
          curl -sf "$prom/api/v1/rules" | python3 -c "
          import json, sys
          groups = json.load(sys.stdin)['data']['groups']
          rules = [r for g in groups for r in g['rules']]
          bad = [(r['name'], r.get('health'), r.get('lastError')) for r in rules if r.get('health') != 'ok']
          assert rules and not bad, bad
          print(len(rules), 'rules loaded, all ok')
          "
          state() { curl -sf "$prom/api/v1/rules?type=alert" | python3 -c "
          import json, sys
          print(next(r['state'] for g in json.load(sys.stdin)['data']['groups'] for r in g['rules']
                     if r['name'] == 'AndaraServerUnavailable'))
          "; }
          await() {
            local want="$1" deadline="$2" s=""
            for _ in $(seq "$deadline"); do
              s=$(state || true)
              [[ "$s" == "$want" ]] && { echo "AndaraServerUnavailable: $s"; return 0; }
              sleep 1
            done
            echo "AndaraServerUnavailable is ${s:-unreadable}, not $want, after ${deadline}s" >&2
            return 1
          }
          await inactive 30
          $compose stop andara-server
          # Pending, not firing: `for: 2m` has not elapsed, and one alert is what a stopped
          # server is — the per-environment absent() lines stay silent without a namespace.
          await pending 60
          $compose start andara-server
          await inactive 120

      - name: down leaves nothing behind
        run: |
          set -euo pipefail
          make down VOLUMES=1
          test -z "$(docker ps -aq --filter name=andara)" || { docker ps -a --filter name=andara; exit 1; }
          test -z "$(docker volume ls -q --filter name=andara)" || { docker volume ls --filter name=andara; exit 1; }
          echo "no residual containers or volumes"

      - name: diagnostics on failure
        if: failure()
        run: make ps || true; docker compose -f deploy/compose/docker-compose.yaml logs --tail=100 || true
