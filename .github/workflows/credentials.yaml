# The expiry of the hand-made Grafana Cloud credentials (AW-INF-076, ADR-0012 decision 4).
#
#   credentials-expiry   daily and by hand: reads deploy/terraform/grafana/credentials.yaml (names and dates,
#                        never values) and opens the one issue labelled credentials-expiry, or rewrites its
#                        body, while any credential is within its warning window or expired. A clean check
#                        closes it.
#
# It calls no Grafana API and holds no credential, so it needs no environment and no approval. A failed run
# notifies only whoever last edited this file, and a broken check would look like nothing expiring, so a
# failure opens or updates the same issue: the script reports an unreadable file itself, and the last step
# reports any failure it didn't (a checkout or install that failed).

name: credentials

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: credentials-expiry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the pinned PyYAML
        run: python3 -m pip install --quiet -r scripts/requirements.txt
      - name: check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/tf_credentials.py --issue
      # gh --repo only: after a failed checkout there are no repository files to run.
      - name: a failed check opens the issue
        if: failure() && steps.check.outputs.reported != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="credentials-expiry"
          repo="$GITHUB_REPOSITORY"
          body="The credentials-expiry check failed before it could report (checkout, install, or the check itself). Until it runs, no expiry is being watched. Run: $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          gh label create "$label" --repo "$repo" --color D93F0B --force \
            --description "A hand-made Grafana Cloud credential near or past its expiry, or a failed check (AW-INF-076)" >/dev/null
          n="$(gh issue list --repo "$repo" --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$repo" --body "$body"
          else
            gh issue create --repo "$repo" --title "Credentials expiry check failed" --label "$label" --body "$body"
          fi
