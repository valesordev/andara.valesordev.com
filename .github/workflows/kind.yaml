# Chart lifecycle on a real cluster (AW-INF-003 test plan, integration half) and the
# edge (AW-INF-006): `make platform-up PROFILE=ci` (cert-manager, andara-ca and Traefik with
# PROXY-protocol trust, at deploy/platform/versions.yaml's pins, AW-INF-054), then TLS, gRPC
# routing, the Admin allowlist and PROXY trust, NetworkPolicy, and the stream soak — 5 m on a
# pull request, 60 m on the nightly schedule.
#
# Separate from `check` for the same reason stack.yaml is: `make check` must not need a
# cluster. What this proves today: the chart installs, the pod is ready only once
# /readyz says so, the snapshot claim survives uninstall and is reattached by the next
# install. What it cannot prove yet, named rather than skipped: not-ready during log
# replay (AC-2) and liveness restart on a wedged tick (AC-8) need AW-SRV-007 and
# AW-SRV-002 to exist.

name: kind

on:
  push:
    branches: [main]
    paths:
      - "deploy/argocd/**"
      - "scripts/argocd.py"
      - "deploy/helm/**"
      - "deploy/k8s/**"
      - "deploy/kind/**"
      - "deploy/compose/Dockerfile.server"
      - "scripts/helm_install.sh"
      - "scripts/k8s_dry.sh"
      - "deploy/platform/**"
      - "scripts/platform_up.py"
      - "scripts/cluster_secrets.py"
      - "scripts/tf.py"
      - "scripts/stream_soak.sh"
      - "scripts/kube.py"
      - "scripts/kube.sh"
      - "internal/smoke/soak_test.go"
      - ".github/workflows/kind.yaml"
  pull_request:
    paths:
      - "deploy/argocd/**"
      - "scripts/argocd.py"
      - "deploy/helm/**"
      - "deploy/k8s/**"
      - "deploy/kind/**"
      - "deploy/compose/Dockerfile.server"
      - "scripts/helm_install.sh"
      - "scripts/k8s_dry.sh"
      - "deploy/platform/**"
      - "scripts/platform_up.py"
      - "scripts/cluster_secrets.py"
      - "scripts/tf.py"
      - "scripts/stream_soak.sh"
      - "scripts/kube.py"
      - "scripts/kube.sh"
      - "internal/smoke/soak_test.go"
      - ".github/workflows/kind.yaml"
  # Nightly: the 60 m soak (AW-INF-006 AC-1). A pull request runs the same soak for 5 m.
  schedule:
    - cron: "41 6 * * *"

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # Every script, target and inline call acts on CI's cluster by name, never the ambient
    # context (AW-INF-053, ADR-0013 decision 1). kind-action names the cluster `ci`.
    env:
      ANDARA_KUBE_CONTEXT: kind-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bootstrap
        run: make bootstrap
      # The node image is versions.yaml's, tag and digest, the box's own (AW-INF-054).
      - name: node image from deploy/platform/versions.yaml
        id: pins
        run: |
          set -euo pipefail
          image="$(python3 -c 'import yaml; print(yaml.safe_load(open("deploy/platform/versions.yaml"))["kind"]["nodeImage"])')"
          echo "node_image=$image" >> "$GITHUB_OUTPUT"
      - name: kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          # kind must be new enough for the node image: v1.36 nodes carry containerd
          # config v4, which the action's default kind cannot load images into.
          version: v0.33.0
          node_image: ${{ steps.pins.outputs.node_image }}
          config: deploy/kind/config.yaml
      - name: platform-up PROFILE=ci (cert-manager, andara-ca, Traefik with PROXY trust)
        run: |
          set -euo pipefail
          make platform-up PROFILE=ci
          # AW-INF-054 AC-12: ci installs those and nothing else.
          releases="$(helm --kube-context "$ANDARA_KUBE_CONTEXT" list -A -o json | python3 -c 'import json,sys; print(" ".join(sorted(r["name"] for r in json.load(sys.stdin))))')"
          [[ "$releases" == "cert-manager traefik" ]] \
            || { echo "::error::platform-up PROFILE=ci installed '$releases', not 'cert-manager traefik'"; exit 1; }
      - name: image
        run: make image
      - name: kind-load
        run: make kind-load
      - name: helm-install
        run: make helm-install ENV=local
      - name: pod is ready because /readyz says so
        run: |
          set -euo pipefail
          NS=andara-local
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS wait --for=condition=Ready pod/andara-0 --timeout=120s
          # Status, not body: the body is "ok" on main today and becomes a JSON phase with
          # AW-SRV-007; the probe contract is the 200, and the readiness probe is this URL.
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS exec andara-0 -c server -- wget -S --spider http://127.0.0.1:8080/readyz 2>&1 \
            | tee /dev/stderr | grep -q 'HTTP/1.1 200'
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS get endpointslice -l kubernetes.io/service-name=andara \
            -o jsonpath='{.items[0].endpoints[0].conditions.ready}' | grep -q true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS logs andara-0 -c partitions | grep -q 'ordinal=0 replicas=1 -> 0,1,2'
      - name: snapshot claim survives uninstall and is reattached
        run: |
          set -euo pipefail
          NS=andara-local
          pv="$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS get pvc snapshots-andara-0 -o jsonpath='{.spec.volumeName}')"
          echo "pv before: $pv"
          helm --kube-context "$ANDARA_KUBE_CONTEXT" -n $NS uninstall andara
          sleep 5
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS get pvc snapshots-andara-0 -o jsonpath='{.status.phase}' | grep -q Bound
          make helm-install ENV=local
          after="$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS get pvc snapshots-andara-0 -o jsonpath='{.spec.volumeName}')"
          echo "pv after:  $after"
          [[ "$pv" == "$after" ]]
      # AW-INF-006. Everything below talks to the edge on the runner's :443, which the
      # kind config maps to the control plane, where Traefik holds the host port.
      - name: certificates issued, no key material in the rendered chart (AC-5)
        run: |
          set -euo pipefail
          NS=andara-local
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS get certificate andara-edge andara-server
          ! helm --kube-context "$ANDARA_KUBE_CONTEXT" -n $NS get manifest andara | grep -q 'PRIVATE KEY'
      # AW-SRV-008: a Session needs a real token. The bootstrap operator `make helm-install`
      # configured authenticates through the edge; every step below carries its token.
      - name: authenticate as the bootstrap operator through the edge
        run: |
          set -euo pipefail
          CA=.local/tls/cluster/local/ca.pem
          TOKEN=$(curl -sf --cacert $CA --resolve andara.local:443:127.0.0.1 \
            -X POST -H 'content-type: application/json' \
            https://andara.local/andara.auth.v1.Auth/Authenticate \
            -d '{"username":"operator","password":"andara-local"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tokens"]["sessionToken"])')
          [[ -n "$TOKEN" ]]
          echo "::add-mask::$TOKEN"
          echo "ANDARA_CI_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # A made-up token is refused: the AW-SRV-005 stub is gone.
          code=$(curl -s --cacert $CA --resolve andara.local:443:127.0.0.1 -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            https://andara.local/andara.game.v1.Game/OpenSession \
            -d '{"protocolVersion":1,"authToken":"ci","clientName":"kind-ci/connect"}')
          [[ "$code" == "401" ]]
      - name: Connect and gRPC-Web through the edge on one host (AC-2)
        run: |
          set -euo pipefail
          CA=.local/tls/cluster/local/ca.pem
          curl -sf --cacert $CA --resolve andara.local:443:127.0.0.1 \
            -X POST -H 'content-type: application/json' \
            https://andara.local/andara.game.v1.Game/OpenSession \
            -d '{"protocolVersion":1,"authToken":"'"$ANDARA_CI_TOKEN"'","clientName":"kind-ci/connect"}' | grep -q sessionId
          # The same request as a gRPC-Web frame: 5-byte prefix, then OpenSessionRequest
          # {protocol_version=1, auth_token, client_name} on the protobuf wire.
          python3 - "$ANDARA_CI_TOKEN" > /tmp/open.bin <<'PY'
          import struct, sys
          def varint(n):
              out = b""
              while True:
                  b, n = n & 0x7f, n >> 7
                  out += bytes([b | (0x80 if n else 0)])
                  if not n: return out
          def field(num, wire, payload): return varint(num << 3 | wire) + payload
          tok, name = sys.argv[1].encode(), b"kind-ci/grpc-web"
          msg = field(1, 0, varint(1)) + field(2, 2, varint(len(tok)) + tok) + field(3, 2, varint(len(name)) + name)
          sys.stdout.buffer.write(b"\x00" + struct.pack(">I", len(msg)) + msg)
          PY
          curl -s --cacert $CA --resolve andara.local:443:127.0.0.1 \
            -X POST -H 'content-type: application/grpc-web+proto' -H 'x-grpc-web: 1' \
            https://andara.local/andara.game.v1.Game/OpenSession --data-binary @/tmp/open.bin \
            -o /dev/null -w '%{http_code} %{content_type}\n' | grep -q '^200 application/grpc-web+proto'
      - name: Admin is 403 at the edge from outside the allowlist, and the server never sees it (AC-4)
        run: |
          set -euo pipefail
          NS=andara-local
          CA=.local/tls/cluster/local/ca.pem
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS patch middleware andara-admin-allowlist --type merge \
            -p '{"spec":{"ipAllowList":{"sourceRange":["203.0.113.0/24"]}}}'
          sleep 3
          # "The server logs no request": its own RPC counter for the Admin service, read
          # off the pod, does not move while the edge answers 403.
          admin_calls() { kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS exec andara-0 -c server -- wget -qO- http://127.0.0.1:8080/metrics \
            | awk '/^andara_grpc_requests_total\{.*andara.admin.v1.Admin/ { s += $NF } END { print s + 0 }'; }
          before=$(admin_calls)
          code=$(curl -s --cacert $CA --resolve andara.local:443:127.0.0.1 -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/proto' \
            https://andara.local/andara.admin.v1.Admin/GetServerInfo --data-binary '')
          [[ "$code" == "403" ]]
          [[ "$(admin_calls)" == "$before" ]]
          # The catch-all is unaffected.
          curl -sf --cacert $CA --resolve andara.local:443:127.0.0.1 -X POST -H 'content-type: application/json' \
            https://andara.local/andara.game.v1.Game/OpenSession -d '{"protocolVersion":1,"authToken":"'"$ANDARA_CI_TOKEN"'","clientName":"kind-ci"}' >/dev/null
          # Put the allowlist back explicitly. `helm upgrade` would not: for a CRD-typed
          # resource Helm patches old manifest → new manifest and never reads live state,
          # so an unchanged values file leaves a hand-patched Middleware as it is.
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS patch middleware andara-admin-allowlist --type merge \
            -p '{"spec":{"ipAllowList":{"sourceRange":["10.0.0.0/8","192.168.0.0/16","172.16.0.0/12","127.0.0.0/8"]}}}'
      # AW-INF-054. Every request from the runner reaches Traefik from the kind network's gateway,
      # the one peer websecure trusts for the PROXY protocol, so curl can forge the client. Outside
      # the allowlist: 403 at the edge, and the server never sees it. Inside: forwarded, and
      # Traefik's access log names the forged client (AC-6). With no PROXY header at all, as every
      # --resolve step above sends, the request is still accepted (AC-7).
      - name: the edge trusts PROXY from the kind gateway, and only the allowlist passes (AW-INF-054 AC-6, AC-7)
        run: |
          set -euo pipefail
          NS=andara-local
          CA=.local/tls/cluster/local/ca.pem
          admin() { curl -s --cacert $CA --resolve andara.local:443:127.0.0.1 "$@" -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H "authorization: Bearer $ANDARA_CI_TOKEN" \
            https://andara.local/andara.admin.v1.Admin/GetServerInfo -d '{}'; }
          admin_calls() { kubectl --context "$ANDARA_KUBE_CONTEXT" -n $NS exec andara-0 -c server -- wget -qO- http://127.0.0.1:8080/metrics \
            | awk '/^andara_grpc_requests_total\{.*andara.admin.v1.Admin/ { s += $NF } END { print s + 0 }'; }
          # The step above narrowed the allowlist to 203.0.113.0/24 and put it back as its last
          # command; Traefik reloads a Middleware asynchronously, so until it has, 203.0.113.9 is
          # still allowed. Poll to the restored allowlist (live-assertions rule 1), then assert.
          code=""
          for i in $(seq 1 30); do
            code=$(admin --haproxy-protocol --haproxy-clientip 203.0.113.9)
            [[ "$code" == "403" ]] && break
            sleep 1
          done
          [[ "$code" == "403" ]] || { echo "::error::a PROXY client 203.0.113.9 (outside the allowlist) got $code, not 403, for 30 s"; exit 1; }
          before=$(admin_calls)
          code=$(admin --haproxy-protocol --haproxy-clientip 203.0.113.9)
          [[ "$code" == "403" ]] || { echo "::error::a PROXY client 203.0.113.9 (outside the allowlist) got $code, not 403"; exit 1; }
          [[ "$(admin_calls)" == "$before" ]] || { echo "::error::the server saw a request the edge refused"; exit 1; }
          code=$(admin --haproxy-protocol --haproxy-clientip 10.1.2.3)
          [[ "$code" == "200" ]] || { echo "::error::a PROXY client 10.1.2.3 (inside the allowlist) got $code, not 200"; exit 1; }
          # Captured before grep: `grep -q` closing the pipe early would fail kubectl under pipefail.
          seen=""
          for i in $(seq 1 10); do
            logs="$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n traefik logs deploy/traefik --since=5m)"
            if grep -q '"ClientHost":"10.1.2.3"' <<<"$logs"; then seen=1; break; fi
            sleep 1
          done
          [[ -n "$seen" ]] || { echo "::error::Traefik's access log has no request from the PROXY client 10.1.2.3"; exit 1; }
          code=$(admin)
          [[ "$code" == "200" ]] || { echo "::error::a request with no PROXY header got $code, not 200"; exit 1; }
      - name: the server pod is unreachable from another namespace (AC-6)
        run: |
          set -euo pipefail
          POD_IP=$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local get pod andara-0 -o jsonpath='{.status.podIP}')
          kubectl --context "$ANDARA_KUBE_CONTEXT" create ns andara-probe
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-probe run prober --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 300
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-probe wait --for=condition=Ready pod/prober --timeout=120s
          if kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-probe exec prober -- curl -sk -m 5 -o /dev/null https://$POD_IP:8443/; then
            echo "::error::a pod in another namespace reached the server's grpc port"; exit 1
          fi
          if kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-probe exec prober -- curl -s -m 5 -o /dev/null http://$POD_IP:8080/readyz; then
            echo "::error::a pod in another namespace reached the server's http port"; exit 1
          fi
          kubectl --context "$ANDARA_KUBE_CONTEXT" delete ns andara-probe --wait=false
      - name: stream soak through the edge, renewal mid-stream (AC-1, AC-3)
        run: make stream-soak ENV=local SOAK=${{ github.event_name == 'schedule' && '60m' || '5m' }}
      # AW-INF-019, the install and render half. The follow-main loop needs `publish` and
      # is recorded on the box instead. AC-1: Argo CD and Image Updater at the pinned
      # versions, and a second run that changes nothing.
      - name: argocd-install twice, the second a no-op (AW-INF-019 AC-1)
        run: |
          set -euo pipefail
          make argocd-install
          before="$(helm --kube-context "$ANDARA_KUBE_CONTEXT" list -n argocd -o json | python3 -c 'import json,sys; print(sorted((r["name"], r["revision"]) for r in json.load(sys.stdin)))')"
          make argocd-install | tee /tmp/second.txt
          after="$(helm --kube-context "$ANDARA_KUBE_CONTEXT" list -n argocd -o json | python3 -c 'import json,sys; print(sorted((r["name"], r["revision"]) for r in json.load(sys.stdin)))')"
          [ "$before" = "$after" ] || { echo "::error::the second argocd-install changed a release: $before -> $after"; exit 1; }
          [ "$(grep -c 'already installed' /tmp/second.txt)" = 2 ]
      # The committed Application, pointed at this commit with local's values (no broker,
      # the kind-loaded image), adopting the andara release the steps above installed: the
      # same adoption dev's move makes. Synced/Healthy within the deadline, and the pod the
      # release left is the one still running (the move doesn't roll it).
      - name: an Application at this commit adopts andara-local, Synced and Healthy (AW-INF-019)
        env:
          # The tree checkout tested: on a pull_request run github.sha is GitHub's merge of
          # the PR into the base (refs/pull/N/merge), not the PR's head, so Argo CD renders
          # the same chart and values the helm-install above did (review of #134).
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          uid="$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local get pod andara-0 -o jsonpath='{.metadata.uid}')"
          python3 - "$REVISION" <<'PY' | kubectl --context "$ANDARA_KUBE_CONTEXT" apply -f -
          import json, sys, yaml
          app = yaml.safe_load(open("deploy/argocd/andara-dev.yaml"))
          app["metadata"]["name"] = "andara-ci"
          app["spec"]["source"]["targetRevision"] = sys.argv[1]
          app["spec"]["source"]["helm"]["valueFiles"] = ["../values/local.yaml"]
          app["spec"]["destination"]["namespace"] = "andara-local"
          print(json.dumps(app))
          PY
          for i in $(seq 1 120); do
            s="$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd get application andara-ci -o jsonpath='{.status.sync.status} {.status.health.status}')"
            [ "$s" = "Synced Healthy" ] && break
            sleep 5
          done
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd get application andara-ci -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}{"\n"}'
          [ "$s" = "Synced Healthy" ] || { echo "::error::andara-ci is '$s' after 10 minutes"; exit 1; }
          [ "$(kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local get pod andara-0 -o jsonpath='{.metadata.uid}')" = "$uid" ] \
            || { echo "::error::the adoption rolled andara-0"; exit 1; }
      - name: dump on failure
        if: failure()
        run: |
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local describe pod andara-0 || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local logs andara-0 --all-containers || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n andara-local get certificate,ingress,middleware,serverstransport -o wide || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n traefik logs deploy/traefik --tail=200 || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd get application -o yaml || true
          helm --kube-context "$ANDARA_KUBE_CONTEXT" -n argocd status argocd || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd get pods,jobs -o wide || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd describe pods | tail -120 || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" -n argocd get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl --context "$ANDARA_KUBE_CONTEXT" describe nodes | sed -n '/Allocated resources/,/Events/p' || true
