// The Kafka log: the ordering authority for the entire World (ADR-0002).
//
// DETERMINISM RULES — these messages feed the State Hash, so they obey
// ADR-0007 rule 3 without exception:
//
//   * no `map` fields — protobuf does not specify map ordering, so two
//     encodings of one value would hash differently. Use a `repeated` message
//     sorted by an explicit key.
//   * no `float` or `double` — floating-point representation and arithmetic
//     are not reproducible across platforms, and replay must be exact.
//   * no `google.protobuf.Any` — its encoding depends on a type registry that
//     can differ between binaries.
//   * `int64`/`uint64` rather than Timestamp — one field, no well-known-type
//     dependency inside a hashed record.
//
// A record written today must be readable by a binary built years from now, so
// field numbers here are permanent. Removed fields become `reserved` and are
// never reused (ADR-0007 rule 1).

syntax = "proto3";

package andara.log.v1;

import "andara/content/v1/zone.proto";

// A Command that has been parsed and authorized at the Gateway and produced to
// its Zone's partition. `Validate` and `Apply` accept only this type, so the
// log boundary cannot be bypassed by accident (AW-SRV-003).
//
// The raw text a player typed is NOT carried here. It is a Gateway input
// (andara.game.v1.SubmitRequest.raw); by this point it has been parsed, and
// replaying parse would mean replaying a verb table that may have changed.
message LoggedCommand {
  // Partition key input. The Zone determines the partition, and the mapping
  // hash(zone_id) % 64 is permanent because repartitioning a keyed topic
  // reorders history (ADR-0002).
  string zone_id = 1;

  // Who acts. Authorization already happened; this is the authorized actor.
  string actor_id = 2;

  // Correlation, not authorization. Carried so an Event can be traced back to
  // the Session that caused it, and so a client's client_ref can be echoed.
  string session_id = 3;
  string client_ref = 4;

  // W3C trace parent, so a Command in the log joins the trace that produced it
  // (AW-SRV-005). Diagnostic: it never affects apply, and it is excluded from
  // the State Hash for exactly that reason.
  string trace_id = 5;

  // Wall-clock time the Gateway accepted it, unix nanoseconds. Diagnostic
  // only. The simulation advances by Tick, never by this value — reading it in
  // `Apply` would make replay depend on when it ran (ADR-0002, ADR-0008).
  int64 accepted_at_unix_nano = 6;

  oneof command {
    Look look = 10;
    Move move = 11;
    Arrive arrive = 12;
    // 13 and 14 are AW-SRV-028's (HandoffAck, HandoffRejected).
    BindCharacter bind_character = 15;
    UnbindCharacter unbind_character = 16;
  }

  // Verbs beyond these arrive with their own stories, taking numbers from 17
  // upward — deliberately NOT `reserved`. A reserved range would have
  // to shrink to add a verb, and buf treats shrinking one as a breaking change,
  // so reserving numbers "to hold them" makes the most routine schema change in
  // the project fail CI. `reserved` is for numbers that have been used and
  // retired; an unused number needs no ceremony to stay available.
}

message Look {}

message Move {
  // A Direction label. Deliberately a string, not an enum. The canonical
  // Direction set was closed on 2026-09-10 (docs/glossary.md) and this stayed
  // a string, exactly as planned: closing the set is a change to validation,
  // never to the wire. A string lets the parser reject an unknown direction
  // with a real error where the wire would silently drop an unknown enum
  // member, and it lets the set grow without a schema change.
  string direction = 1;
}

// The cross-Zone half of a Move (ADR-0001 rule 4, AW-SRV-003 AC-9). The
// source Zone's tick removed the Entity from its own state and produced this
// to the target Zone's partition; the target's tick places it. It is never a
// player's verb — the verb table has no entry that binds it, so `parse` cannot
// produce one — and it is always produced by a tick, so it is already ordered
// with respect to everything else in the target Zone.
//
// The Entity travels by value because there is no other way for it to cross
// a partition boundary: the target process, which may be a different one,
// holds nothing of it (ADR-0001 consequences).
message Arrive {
  // The Room inside the target Zone (LoggedCommand.zone_id) to place it in.
  string room_id = 1;

  // The Direction it came through, for CharacterArrived.from_direction.
  string from_direction = 2;

  // The Entity as the source Zone last held it.
  Entity entity = 3;

  // Where it left from, so a target that no longer has room_id — content
  // moved under the log — can send it back rather than lose it. Cleared on
  // the way back, so a bounce is one hop, never a loop.
  string origin_zone_id = 4;
  string origin_room_id = 5;
}

// A Session enters the World as a Character (AW-SRV-014). Produced by the
// Gateway's SelectCharacter after the roster's checks — ownership, the
// one-live rule — so the sim trusts it the way it trusts any authorized
// Command. actor_id is the character_id. The body is a dormant Entity in
// this Zone (cleared, and its arrival emitted where it stands), a present
// one (taken where it stands, nothing emitted — a crash or a failed teardown
// left it), or nothing yet (instantiated from andara.core.Character at
// spawn_room_id).
message BindCharacter {
  string character_id = 1;
  string account_id = 2;
  // The display name, immutable, carried so the body needs no roster.
  string name = 3;
  // The Room in LoggedCommand.zone_id to place a never-bound Character in:
  // character.spawn_room. Ignored when the body exists.
  string spawn_room_id = 4;
}

// The Session left the World (AW-SRV-014): the body goes dormant where it
// stands — in no Room's occupant list, invisible to look, addressed by no
// Event — and its departure is emitted with an empty to_direction. Produced
// by the Session's teardown; a body with no UnbindCharacter in the log (a
// crash) stays present until the next BindCharacter takes it.
message UnbindCharacter {
  string character_id = 1;
  UnbindReason reason = 2;
}

enum UnbindReason {
  UNBIND_REASON_UNSPECIFIED = 0;
  QUIT = 1;
  // SWITCH is AW-SRV-032's, LINKDEAD AW-SRV-015's; declared so the field
  // never changes shape.
  SWITCH = 2;
  LINKDEAD = 3;
}

// An Entity in transit between Zones: the same shape server/sim holds, so the
// target rebuilds it exactly and the State Hash is the same as if it had been
// there all along. Nothing mutable that is not here can be carried across a
// Zone boundary; a field added to the sim's EntityState is added here in the
// same change. AW-SRV-006's snapshot body may reuse it.
message Entity {
  string id = 1;
  string template = 2;
  string content_version = 3;
  // Sorted by type, one of each — the invariant every reader assumes.
  repeated andara.content.v1.ComponentValue components = 4;
  // The display name, when the Entity has one apart from its ID: a
  // Character's (AW-SRV-014). Dormancy is not carried — a dormant body
  // never moves, so it never crosses a Zone.
  string name = 5;
}

// An Event as it was emitted by the simulation and written to the log. This is
// the durable record; andara.game.v1.EventEnvelope is the client-facing,
// perception-scoped projection of it.
message Event {
  uint64 event_id = 1;
  uint64 tick = 2;
  string zone_id = 3;

  // The Event's own schema version, for changes protobuf cannot absorb.
  // Distinct from state_version, which versions snapshot interpretation.
  uint32 schema_version = 4;

  // Serialized andara.game.v1.EventEnvelope payload. Bytes rather than a
  // nested message so that the log record's encoding does not change when a
  // new client-facing payload type is added, and deliberately not Any.
  bytes payload = 5;

  // Who may perceive this, computed inside the sim before publication
  // (AW-SRV-004). Never recomputed by a transport.
  Scope scope = 6;
}

// Repeated fields here are sorted by the sim before encoding, because this
// record feeds the State Hash.
message Scope {
  string room_zone_id = 1;
  string room_id = 2;
  repeated string entity_ids = 3;
  // Privileged: Game Master and Operator visibility only.
  bool world = 4;
}

// The Tick Boundary Record. Replay reads these to know where a tick ended and
// what the World hashed to at that point (ADR-0002 §4), which is what makes
// recovery verifiable rather than hopeful.
message TickCompleted {
  uint64 tick = 1;

  // Committed offset per partition at the tick boundary. Repeated and sorted
  // by partition rather than a map, per the determinism rules above.
  repeated PartitionOffset offsets = 2;

  // Hash of authoritative World state at the end of this tick. Recovery
  // compares against this; a mismatch halts rather than serving a wrong World
  // (AW-SRV-007, AW-INF-007).
  bytes state_hash = 3;

  // Interpretation version of the state this hash covers (ADR-0002 §4).
  uint32 state_version = 4;

  uint64 events_emitted = 5;
  uint64 commands_applied = 6;
}

message PartitionOffset {
  int32 partition = 1;
  int64 offset = 2;
}
