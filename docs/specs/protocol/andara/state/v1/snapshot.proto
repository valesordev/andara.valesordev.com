// The snapshot envelope (ADR-0002 §4).
//
// A Snapshot is an RTO optimisation, not a correctness mechanism: Kafka holds
// the authority, and recovery from offset zero is always correct, just slow
// (AW-SRV-007). What makes a snapshot usable is that it names exactly where in
// the log it was taken, so the tail can be replayed onto it.
//
// The same determinism rules as andara.log.v1 apply here and for the same
// reason: no map, no float or double, no Any, no Timestamp. This record feeds
// the State Hash.

syntax = "proto3";

package andara.state.v1;

import "andara/log/v1/log.proto";

message SnapshotEnvelope {
  // Interpretation version of the body. Separate from protobuf field evolution
  // (ADR-0007 rule 2): protobuf absorbs an added field, and this integer exists
  // for a change in what the state *means*.
  //
  // A binary that cannot read a state_version refuses to start with both
  // versions named, rather than starting with a World it has misread. On
  // rollback that is the difference between replaying from an older snapshot
  // and silently serving corrupt state (AW-INF-007).
  uint32 state_version = 1;

  // The tick this snapshot is exactly consistent with.
  uint64 tick = 2;

  // Where to resume the log from. Recovery seeks to these offsets and replays
  // forward, so they must be the offsets committed at that tick boundary.
  repeated andara.log.v1.PartitionOffset offsets = 3;

  // Hash of the state in `body`: the hash of THIS ZONE at this tick, not the
  // World's. Recovery verifies rather than trusts, and AW-SRV-007 AC-4's
  // "missing or hash-invalid Zone object" is a per-object check against this.
  //
  // Not the same number as TickCompleted.state_hash, which is global and which
  // AW-SRV-007 AC-5 compares against the recovered World after replay. The two
  // are different assertions at different points; an earlier version of this
  // comment said "comparable to the TickCompleted record for the same tick",
  // which read as though they were interchangeable. They are kept provably
  // consistent rather than merely similar: sim.WorldState.CanonicalBytes
  // composes from a per-Zone section, and this is SHA-256 over that same
  // section, so no second encoding exists to drift.
  bytes state_hash = 4;

  // Which Zone this snapshot covers. Snapshots are per-Zone, and the store key
  // is {zone_id}/{state_version}/{tick}/{offset} (AW-SRV-006), so a Zone can be
  // restored without the whole World and a round is a prefix group.
  string zone_id = 5;

  // Diagnostic only, never read by recovery logic — the same rule as
  // LoggedCommand.accepted_at_unix_nano.
  int64 taken_at_unix_nano = 6;

  // The serialized Zone state: andara.state.v1.ZoneState, in zone_state.proto.
  // Bytes rather than a nested message keeps the envelope stable while the body
  // evolves independently, versioned by state_version above.
  bytes body = 7;

  // Compression, chunking, and content addressing of the body are all plausible
  // additions for AW-SRV-006 and AW-SRV-007, and none are decided. They take
  // numbers from 8 upward when they arrive; nothing is reserved, because a
  // reserved range has to shrink to be used and buf counts that as breaking.
}
