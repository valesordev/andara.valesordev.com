// The Admin service.
//
// ADR-0003 keeps Admin on the same endpoint and the same protocol as Game:
// andara-cli has no privileged back door and no direct datastore access, and
// an operator action goes through the same wire as a player's (CLAUDE.md §10).
// Restricting Admin *reachability* at the network layer is compatible with
// that and is an AW-INF-006 decision, still open.
//
// Deliberately minimal. The operator surface — inspect, intervene, snapshot,
// content publish — belongs to the stories that implement each one, and
// inventing RPCs here would assign permanent method names to guesses.

syntax = "proto3";

package andara.admin.v1;

service Admin {
  // Build and content identity of the running server. ADR-0004 decoupled
  // content from code, so reproducing a bug requires naming both — this is the
  // RPC form of the andara_build_info metric (AW-INF-002).
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string version = 1;
  string commit = 2;
  string environment = 3;

  // Which content is live, per ADR-0004's Active Pointer.
  string content_pack_id = 4;
  uint64 content_version = 5;

  // Supported protocol version range, so an operator can diagnose a rejected
  // client without reading logs (AW-SRV-005).
  uint32 protocol_min_version = 6;
  uint32 protocol_max_version = 7;
}
