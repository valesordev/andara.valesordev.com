// The Admin service.
//
// ADR-0003 keeps Admin on the same endpoint and the same protocol as Game:
// andara-cli has no privileged back door and no direct datastore access, and
// an operator action goes through the same wire as a player's (CLAUDE.md §10).
// Restricting Admin *reachability* at the network layer is compatible with
// that and is an AW-INF-006 decision, still open.
//
// Deliberately minimal. The operator surface — inspect, intervene, snapshot,
// content publish — belongs to the stories that implement each one, and
// inventing RPCs here would assign permanent method names to guesses.

syntax = "proto3";

package andara.admin.v1;

import "andara/accounts/v1/account.proto";
import "andara/content/v1/content.proto";
import "andara/state/v1/snapshot.proto";

service Admin {
  // Build and content identity of the running server. ADR-0004 decoupled
  // content from code, so reproducing a bug requires naming both — this is the
  // RPC form of the andara_build_info metric (AW-INF-002).
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // Account administration (AW-SRV-008). Every one of these requires the
  // caller to hold `operator`, and every one writes exactly one record to
  // andara.audit.v1 naming actor, acting-as, action, target, Session, and
  // trace. The mutating ones take expected_record_version for optimistic
  // concurrency: 0 means "whatever it is now"; any other value must match or
  // the call is ABORTED and nothing is written.

  // Create a PASSWORD Account directly. The only path to an Account while
  // the Registration Mode is `closed`.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // Replace an Account's password. No email flow exists in Phase 1
  // (ADR-0006); this is how a locked-out player gets back in.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Replace the role set. Open Sessions on the Account are closed within
  // auth.recheck_interval so they reopen with the new roles.
  rpc SetRoles(SetRolesRequest) returns (SetRolesResponse);
  // ACTIVE or DISABLED. A DISABLED Account's still-valid session token is
  // refused by OpenSession, and its open Sessions are closed within
  // auth.recheck_interval.
  rpc SetAccountStatus(SetAccountStatusRequest) returns (SetAccountStatusResponse);
  // Mint Invite Codes scoped to the caller's Account. The codes are in the
  // response and nowhere else; only their hashes are stored.
  rpc IssueInvite(IssueInviteRequest) returns (IssueInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // Flip the Registration Mode. A write to andara.accounts.v1 under the key
  // "config/registration", not a deploy.
  rpc SetRegistrationMode(SetRegistrationModeRequest) returns (SetRegistrationModeResponse);
  // Create an AGENT Account scoped to one Content Pack. With an API_KEY
  // credential the key is in the response exactly once; with WORKLOAD_JWT
  // there is no secret to return and workload_subject is what the projected
  // token's `sub` must equal.
  rpc CreateAgentAccount(CreateAgentAccountRequest) returns (CreateAgentAccountResponse);
  // Replace the Content Packs a Builder may publish to (AW-SRV-035). The whole
  // set, not a delta, as SetRoles is. Roles and packs are independent: a grant
  // on an Account without BUILDER is stored and inert.
  rpc SetBuilderPacks(SetBuilderPacksRequest) returns (SetBuilderPacksResponse);

  // Content publishing (AW-SRV-013, ADR-0004). Every call is authorized on
  // BUILDER plus the pack in Account.builder_packs, or OPERATOR, and every
  // publish, approval, activation and refusal writes one andara.audit.v1
  // record. andara.core is never published over this service: the server
  // publishes its own embedded core at boot (ADR-0004, 2026-09-28), and an
  // OPERATOR may only move its pointer.

  // Which of these blobs does the store already hold? Lets a publisher
  // upload only what is missing. pack_id is required: it is what the call is
  // authorized on, not a filter on the answer.
  rpc HasBlobs(HasBlobsRequest) returns (HasBlobsResponse);
  // One blob per stream: a header chunk, then data chunks. The server hashes
  // what it receives and refuses a body whose hash differs from the header's.
  // Publishing a blob the store holds is idempotent.
  rpc PublishBlob(stream PublishBlobRequest) returns (PublishBlobResponse);
  // Validate the blobs as one pack and write its version manifest. Findings
  // that refuse the publish are INVALID_ARGUMENT, carried in the status
  // details as PublishFindings. Warnings return in the response. Both are
  // the publisher's own, apart from an error the publish causes in another
  // pack's blobs. A cross-pack Zone clash is reported once, at the
  // publisher's declaration (errors.md §1 rule 10).
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionResponse);
  // Record an approval on the manifest. Never moves the pointer.
  rpc ApproveVersion(ApproveVersionRequest) returns (ApproveVersionResponse);
  // Move the Active Pointer, forward or back. Refuses, before the pointer
  // moves, what the Loader would refuse after it (zone_removed,
  // spawn_room_removed, core_version).
  rpc ActivateVersion(ActivateVersionRequest) returns (ActivateVersionResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // One blob's body, streamed. Authorized on the pack and version named, and
  // refused unless the hash is in that version's manifest, so a hash from
  // another pack reads nothing. Serves content fetch, content diff, content
  // validate --pack, and content decompile --pack (AW-CLI-006 feedback §7).
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
  // Re-resolve the active versions without a pointer move. OPERATOR only.
  rpc ReloadContent(ReloadContentRequest) returns (ReloadContentResponse);

  // Snapshot Rounds (AW-SRV-007). OPERATOR only. Both read the store the
  // server is configured with, and neither touches the live Engine.
  //
  // Rounds the server sees, newest first, with completeness against the Zones
  // this process owns (store.ListRounds).
  rpc ListSnapshotRounds(ListSnapshotRoundsRequest) returns (ListSnapshotRoundsResponse);
  // Restore one round into a scratch Engine, verify it at its own tick
  // (AW-SRV-043), replay it to the log head, and compare with the head's
  // TickCompleted. A mismatch is a response, not an error: the RPC worked.
  // NOT_FOUND for no round at `tick`; FAILED_PRECONDITION for an incomplete
  // round, a log gap, or a state_version this binary can't read;
  // DEADLINE_EXCEEDED past recovery.verify_timeout.
  rpc VerifySnapshotRound(VerifySnapshotRoundRequest) returns (VerifySnapshotRoundResponse);
}

message ListSnapshotRoundsRequest {
  // Empty: every Zone. Otherwise only rounds holding this Zone, with
  // `complete` still judged against every owned Zone.
  string zone_id = 1;
  // 0 means all.
  uint32 limit = 2;
}

message SnapshotRound {
  uint64 tick = 1;
  uint32 state_version = 2;
  // Sorted. The Zones the round holds an object for.
  repeated string zone_ids = 3;
  // Exactly one object for every owned Zone, each hash-valid, and every
  // object's prng_state, next_event_id and sim_seed agreeing (AW-SRV-007 AC-4
  // and AC-11). A round holding one Zone twice is incomplete.
  bool complete = 4;
  // The newest taken_at_unix_nano among the round's objects. Diagnostic only.
  int64 taken_at_unix_nano = 5;
}

message ListSnapshotRoundsResponse {
  // Newest first.
  repeated SnapshotRound rounds = 1;
}

message VerifySnapshotRoundRequest {
  uint64 tick = 1;
}

enum VerifyOutcome {
  VERIFY_OUTCOME_UNSPECIFIED = 0;
  // The round restored to its recorded hash, and replay to head matched.
  VERIFY_OUTCOME_MATCH = 1;
  // The round restored, and replay reached a boundary whose TickCompleted
  // differs from the Engine's hash: the first such boundary, which is the
  // head's only if every earlier one matched (recovery's exit 8).
  VERIFY_OUTCOME_REPLAY_MISMATCH = 2;
  // The restored round differs from its own tick's TickCompleted (AW-SRV-043,
  // recovery's exit 6). Nothing was replayed.
  VERIFY_OUTCOME_RESTORE_MISMATCH = 3;
  // The round's sim_seed differs from the server's effective seed
  // (AW-SRV-043, recovery's exit 6). Nothing was restored.
  VERIFY_OUTCOME_SEED_MISMATCH = 4;
  // The round doesn't restore onto the content in effect: a content_digest
  // mismatch, or a Zone the content doesn't have (recovery's exit 6). Nothing
  // was restored.
  VERIFY_OUTCOME_CONTENT_MISMATCH = 5;
}

message VerifySnapshotRoundResponse {
  // True only for VERIFY_OUTCOME_MATCH.
  bool match = 1;
  // The recorded TickCompleted.state_hash at `compared_tick`, and the
  // Engine's. Empty for a seed or content mismatch.
  bytes expected_hash = 2;
  bytes actual_hash = 3;
  VerifyOutcome outcome = 4;
  // The round's tick for a restore mismatch; the first mismatching
  // boundary's tick for a replay mismatch; the head's tick for a match. 0 for
  // a seed or content mismatch.
  uint64 compared_tick = 5;
  // Set only for a seed mismatch.
  uint64 recorded_seed = 6;
  uint64 configured_seed = 7;
}

message CreateAccountRequest {
  string username = 1;
  string password = 2;
  // Defaults to [PLAYER] when empty.
  repeated andara.accounts.v1.Role roles = 3;
}

message CreateAccountResponse {
  string account_id = 1;
}

message ResetPasswordRequest {
  string account_id = 1;
  string new_password = 2;
  uint64 expected_record_version = 3;
}

message ResetPasswordResponse {
  uint64 record_version = 1;
}

message SetRolesRequest {
  string account_id = 1;
  repeated andara.accounts.v1.Role roles = 2;
  uint64 expected_record_version = 3;
}

message SetRolesResponse {
  uint64 record_version = 1;
}

message SetAccountStatusRequest {
  string account_id = 1;
  andara.accounts.v1.AccountStatus status = 2;
  uint64 expected_record_version = 3;
}

message SetAccountStatusResponse {
  uint64 record_version = 1;
}

message IssueInviteRequest {
  // 1..100. Each code expires auth.invite_ttl after issuance.
  uint32 count = 1;
}

message IssueInviteResponse {
  repeated string codes = 1;
  int64 expires_unix = 2;
}

message RevokeInviteRequest {
  string code = 1;
}

message RevokeInviteResponse {}

message SetRegistrationModeRequest {
  andara.accounts.v1.RegistrationMode mode = 1;
}

message SetRegistrationModeResponse {
  andara.accounts.v1.RegistrationMode previous = 1;
}

message CreateAgentAccountRequest {
  string username = 1;
  string pack_id = 2;
  // API_KEY or WORKLOAD_JWT.
  andara.accounts.v1.CredentialKind credential_kind = 3;
  // Required for WORKLOAD_JWT; refused otherwise.
  string workload_subject = 4;
}

message CreateAgentAccountResponse {
  string account_id = 1;
  // Set only for API_KEY, and only here. It is never stored or logged.
  string api_key = 2;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string version = 1;
  string commit = 2;
  string environment = 3;

  // Which content is live, per ADR-0004's Active Pointer. Deprecated
  // 2026-09-25: a World serves one version per pack, and these hold one.
  // Read `content` instead. They are kept and filled with andara.core's
  // version, so older clients keep working.
  string content_pack_id = 4 [deprecated = true];
  uint64 content_version = 5 [deprecated = true];

  // Supported protocol version range, so an operator can diagnose a rejected
  // client without reading logs (AW-SRV-005).
  uint32 protocol_min_version = 6;
  uint32 protocol_max_version = 7;

  // The content in effect, one entry per pack, sorted by pack_id: what the
  // log says the World runs on (AW-SRV-012), with the digest of the whole
  // content topology. The same values a snapshot records.
  repeated andara.state.v1.PackVersion content = 8;
  bytes content_digest = 9;
}

message SetBuilderPacksRequest {
  string account_id = 1;
  // The whole new set. Empty clears it. Each is a pack id (Content Language
  // semantics.md §1: LOWER_ID segments joined by dots); andara.core is
  // refused.
  repeated string packs = 2;
  uint64 expected_record_version = 3;
}

message SetBuilderPacksResponse {
  // As stored: sorted, deduplicated.
  repeated string builder_packs = 1;
  uint64 record_version = 2;
  // False when the Account lacks BUILDER: the grant is stored and inert.
  bool builder_role = 3;
}

message HasBlobsRequest {
  string pack_id = 1;
  // sha256 of each body. At most 10000 per call.
  repeated bytes hashes = 2;
}

message HasBlobsResponse {
  // present[i] answers hashes[i].
  repeated bool present = 1;
}

message PublishBlobRequest {
  oneof chunk {
    // The first chunk, and only the first.
    PublishBlobHeader header = 1;
    bytes data = 2;
  }
}

message PublishBlobHeader {
  string pack_id = 1;
  // Path within the pack (semantics.md: `<zone>.json`, `templates/…`,
  // `src/….aw`). Diagnostic only: a blob is addressed by its hash.
  string path = 2;
  string media_type = 3;
  // Declared size. Over content.max_blob_bytes is RESOURCE_EXHAUSTED before
  // any data chunk is read; a body longer than declared is refused the same
  // way.
  uint64 size_bytes = 4;
  // sha256 of the body.
  bytes hash = 5;
}

message PublishBlobResponse {
  bytes hash = 1;
  // True when the store already held it and nothing was produced.
  bool deduplicated = 2;
}

message PublishVersionRequest {
  // Never andara.core.
  string pack_id = 1;
  // Sorted by path; every hash must already be in the store.
  repeated andara.content.v1.BlobRef blobs = 2;
  // The newest version the publisher saw (0 for a pack's first). Any other
  // newest version is FAILED_PRECONDITION, reason stale_parent.
  uint64 parent_version = 3;
}

message PublishVersionResponse {
  // Server-assigned, monotonic per pack.
  uint64 version = 1;
  // The andara.core version the pack requires (`requires andara.core@N`),
  // read from the compiled source, not trusted from the caller.
  uint64 core_version = 2;
  // Warnings only (missing_reverse_exit, orphan_room), in this version's own
  // blobs, and another pack's that this version newly causes (errors.md §1
  // rule 10.3). Errors refuse the publish and are in the status details.
  repeated andara.content.v1.Diagnostic warnings = 3;
}

// The status detail of a refused PublishVersion (INVALID_ARGUMENT).
message PublishFindings {
  repeated andara.content.v1.Diagnostic findings = 1;
}

message ApproveVersionRequest {
  string pack_id = 1;
  uint64 version = 2;
}

message ApproveVersionResponse {
  string approved_by = 1;
  int64 approved_at_unix_nano = 2;
  // The approver is the manifest's `author`, or its `publisher` (the real actor
  // behind an acting-as publish; AW-SRV-039). Only an OPERATOR can do this, and only while
  // content.operator_self_approval is true.
  bool self_approval = 3;
}

message ActivateVersionRequest {
  string pack_id = 1;
  uint64 version = 2;
  // OPERATOR only: activate an unapproved version. Requires reason.
  bool override = 3;
  string reason = 4;
}

message ActivateVersionResponse {
  // The version the pointer left. 0 when the pack had none.
  uint64 previous_version = 1;
  // True when version < previous_version.
  bool rollback = 2;
}

// The status detail of an ActivateVersion refused because of what the version
// would do to the World in effect (FAILED_PRECONDITION). Not sent for a
// missing approval, which is reason `unapproved` in the ErrorInfo alone.
message ActivationRefusal {
  // zone_removed, spawn_room_removed, or core_version (AW-SRV-012's codes).
  string reason = 1;
  // The Zone removed, the spawn Room dropped, or for core_version every pack
  // that the move would strand, as `pack@version`.
  repeated string subjects = 2;
}

message ListVersionsRequest {
  string pack_id = 1;
  // 0 means all. Newest first.
  uint32 limit = 2;
}

message ListVersionsResponse {
  // Newest first.
  repeated andara.content.v1.ContentVersion versions = 1;
  // 0 when nothing is active.
  uint64 active_version = 2;
  // Every pointer move for this pack, oldest first, so history can show
  // active intervals.
  repeated andara.content.v1.ActiveVersion activations = 3;
}

message GetVersionRequest {
  string pack_id = 1;
  uint64 version = 2;
}

message GetVersionResponse {
  andara.content.v1.ContentVersion version = 1;
}

message GetBlobRequest {
  string pack_id = 1;
  uint64 version = 2;
  bytes hash = 3;
}

message GetBlobResponse {
  // The body, in order. Chunks are at most 1 MiB.
  bytes data = 1;
}

message ReloadContentRequest {}

message ReloadContentResponse {
  // What the reload found active, sorted by pack_id. The swap itself happens
  // at a tick boundary; GetServerInfo.content shows when it has.
  repeated andara.state.v1.PackVersion active = 1;
}
