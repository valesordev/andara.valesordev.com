// The privileged-action record — the andara.audit.v1 topic.
//
// AW-SRV-008 writes the first one: every Admin RPC, every authorize rejection,
// every invite issued or redeemed, every refresh token revoked. AW-SRV-013 adds
// the content-publish fields (pack, version, override, reason) additively;
// numbers from 20 up are theirs.
//
// Keyed by actor_account_id, so one operator's history is one partition's
// order. Retention is 365 days (deploy/kafka/topics.yaml): this is the record
// of who did what with operator authority, and long retention is the point.

syntax = "proto3";

package andara.audit.v1;

message AuditRecord {
  // Who was really acting. Never empty: an unauthenticated attempt is not a
  // privileged action and is not audited here.
  string actor_account_id = 1;
  // Set when the actor opened the Session as another Account (AW-SRV-008
  // AC-10). Every audited action in that Session names both identities.
  string acting_as_account_id = 2;
  // Bounded by the Admin RPC list plus `authorize` and the auth events;
  // `andara_privileged_actions_total` uses it as a label, so it must stay
  // low-cardinality.
  string action = 3;
  // What the action was applied to: an account_id, a verb, a mode. Never a
  // username on a failure path and never credential material.
  string target = 4;
  // `ok`, `denied`, `conflict`, ... — the outcome the caller saw.
  string outcome = 5;
  // Session correlation, empty for an Admin call that has no Session (a
  // bearer-token call from andara-cli).
  string session_id = 6;
  string trace_id = 7;
  int64 ts_unix_nano = 8;
  // Free text for the operator reading the record, with the same
  // prohibition as every other field: no secret, no token, no hash.
  string detail = 9;

  // Content publishing (AW-SRV-013). action is publish, approve, activate,
  // rollback, reject, or override; target is `pack@version`.
  string pack_id = 20;
  uint64 version = 21;
  // sha256 of the sorted list of the version's blob hashes.
  bytes blob_hashes_sha256 = 22;
  bool override = 23;
  // Required with override. For andara.core published or activated at boot,
  // `boot <build version>`, and actor_account_id is `server`.
  string reason = 24;
  uint32 findings_count = 25;
  // The approver is the manifest's `author`, or its `publisher` (the real actor
  // behind an acting-as publish; AW-SRV-039) (ADR-0004, amended 2026-09-26,
  // where "publisher" means `author`).
  bool self_approval = 26;

  // SetBuilderPacks (AW-SRV-035): the Account's pack set before and after.
  repeated string builder_packs_before = 27;
  repeated string builder_packs_after = 28;
}
