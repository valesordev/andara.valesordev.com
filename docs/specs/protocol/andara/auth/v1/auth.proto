// The Auth service: how a player gets the session token OpenSession carries.
//
// Served on the same endpoint as Game and Admin (ADR-0003). None of these
// RPCs is authenticated by the interceptor chain — they are how a caller
// becomes authenticated — so each is rate-limited per username and per peer
// address instead (AW-SRV-008 `auth.rate_limit`), and none is ever a lockout,
// because a lockout is a denial-of-service lever.

syntax = "proto3";

package andara.auth.v1;

service Auth {
  // Create an Account. Refused with FAILED_PRECONDITION while the
  // Registration Mode is `closed`, and with PERMISSION_DENIED in `invite`
  // mode unless invite_code is valid, unexpired, unrevoked, and unredeemed —
  // one message for all three, so the code space cannot be probed.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Username and password to a token pair. A failure is UNAUTHENTICATED with
  // one fixed message whether the Account is unknown or the password wrong,
  // and the two paths cost the same (AW-SRV-008 AC-2).
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // A refresh token to a fresh pair. The presented refresh token is retired;
  // the new one replaces it. A revoked or expired token is UNAUTHENTICATED
  // and the attempt is audited.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Retire a refresh token, or every refresh token on its Account. Session
  // tokens are stateless and expire on their own; revoking an Account's
  // access now is Admin.SetAccountStatus, which the recheck loop enforces
  // against open Sessions within auth.recheck_interval.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  // Required in `invite` mode, ignored in `open`.
  string invite_code = 3;
}

message RegisterResponse {
  string account_id = 1;
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateResponse {
  TokenPair tokens = 1;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

// The story sketch had Authenticate and Refresh return TokenPair directly;
// buf's RPC_REQUEST_RESPONSE_UNIQUE rule wants one response type per RPC, so
// each wraps the pair instead.
message TokenPair {
  // Signed and stateless: base64url(payload).base64url(HMAC-SHA256). The
  // payload names the Account and the expiry, never roles — those are read
  // from the Account index at use, so disabling an Account takes effect
  // without waiting for the token to expire. This is what
  // OpenSessionRequest.auth_token and the Admin bearer header carry.
  string session_token = 1;
  int64 session_expires_unix = 2;
  // Opaque, 32 random bytes; only its SHA-256 is stored.
  string refresh_token = 3;
  int64 refresh_expires_unix = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RevokeRequest {
  // The refresh token names the Account; possessing it is the authority to
  // revoke it.
  string refresh_token = 1;
  // Revoke every refresh token on the Account named by refresh_token, not
  // only this one.
  bool all = 2;
}

message RevokeResponse {
  uint32 revoked = 1;
}
