// Zone Definitions — the topology AW-SRV-001 loads into an immutable World.
//
// This is the canonical form. Builders do not author it directly: ADR-0007
// makes protobuf the authority and ADR-0009 puts a purpose-built text language
// in front of it, because nobody hand-writes protobuf for a room description.
//
// AW-SRV-001's loader takes []ZoneDefinition and does not care where they came
// from, which is what lets one validator serve the CLI, the publish path, and
// load time (ADR-0004).

syntax = "proto3";

package andara.content.v1;

message ZoneDefinition {
  // Rejected at load with both the file's version and the supported range
  // named, rather than being partially understood (ADR-0004).
  uint32 format_version = 1;

  string id = 2;
  string name = 3;

  // Sorted by room id by the compiler. Load must be deterministic: the same
  // definition must produce the same World, and a repeated field with a stable
  // order is what gives that. A map would not — see andara/log/v1/log.proto for
  // why unspecified ordering is disqualifying anywhere near the State Hash.
  repeated RoomDefinition rooms = 4;

  // The Zone→Partition mapping is hash(id) % 64, computed at load rather than
  // carried here (AW-SRV-001). Content does not get to choose its partition:
  // the mapping is permanent because repartitioning a keyed topic reorders
  // history (ADR-0002).
}

message RoomDefinition {
  // Unique within the Zone. Duplicates are a load error.
  string id = 1;
  string title = 2;
  string description = 3;

  // Sorted by direction. Every target must resolve to an existing Room, in this
  // Zone or another, or the load fails naming the file, room, and direction
  // (AW-SRV-001).
  repeated ExitDefinition exits = 4;

  // ADR-0010 was accepted on 2026-09-10 and decision 8 says Rooms and Zones
  // carry Components. The component set attaches here, at field 5, in
  // AW-SRV-021. Still deliberately not `reserved`: adding the field is
  // additive and needs no reservation, while a reserved range would have to
  // shrink to accept it, which buf counts as a breaking change.
  //
  // It will be `repeated`, sorted by component type, because a Room's
  // components feed the State Hash and ADR-0007 rule 3 forbids maps there.
}

message ExitDefinition {
  // A Direction label, not an enum. The canonical set is closed as of
  // 2026-09-10 — the twelve in docs/glossary.md — but it is closed in the
  // loader's validation, not here: a string lets the loader reject `norht`
  // with an error naming the file and line, where a closed enum would drop it
  // as an unknown member on the wire, which is silently worse. Growing the set
  // stays a validation change, never a schema change.
  string direction = 1;

  // Target Room. Cross-Zone Exits are resolved at load time as Zone+Room value
  // pairs, never as pointers — ADR-0001's seam invariant, and what allows a
  // Zone to move to another process later without rewriting its exits.
  //
  // Empty `to_zone` means the containing Zone, which is the common case and
  // keeps intra-Zone exits terse. `to_room` is always required.
  string to_zone = 2;
  string to_room = 3;
}
