// Zone Definitions — the topology AW-SRV-001 loads into an immutable World.
//
// This is the canonical form. Builders do not author it directly: ADR-0007
// makes protobuf the authority and ADR-0009 puts a purpose-built text language
// in front of it, because nobody hand-writes protobuf for a room description.
//
// AW-SRV-001's loader takes []ZoneDefinition and does not care where they came
// from, which is what lets one validator serve the CLI, the publish path, and
// load time (ADR-0004).

syntax = "proto3";

package andara.content.v1;

message ZoneDefinition {
  // Rejected at load with both versions named when the server does not support
  // it, rather than being partially understood (ADR-0004).
  uint32 format_version = 1;

  string zone_id = 2;
  string name = 3;

  // Sorted by room_id by the compiler. Load must be deterministic: the same
  // definition must produce the same World, and a repeated field with a stable
  // order is what gives that (a map would not — see andara/log/v1/log.proto).
  repeated RoomDefinition rooms = 4;

  // The Zone→Partition mapping is hash(zone_id) % 64, computed at load rather
  // than carried here (AW-SRV-001). Content does not get to choose its
  // partition: the mapping is permanent because repartitioning a keyed topic
  // reorders history (ADR-0002).
}

message RoomDefinition {
  // Unique within the Zone. Duplicates are a load error.
  string room_id = 1;
  string title = 2;
  string description = 3;

  // Sorted by direction. Every target must resolve to an existing Room, in
  // this Zone or another, or the load fails naming the file, room, and
  // direction (AW-SRV-001).
  repeated ExitDefinition exits = 4;

  // Held for ADR-0010's component set. That ADR is `proposed`, and a Room
  // carrying a Dark{} or NoMagic{} component is a natural want — but assigning
  // a permanent field number to an unaccepted design is exactly what ADR-0007
  // rule 1 makes expensive. Adding it later is additive; reserving now just
  // marks the intent so nobody takes the number for something else.
  reserved 5 to 9;
}

message ExitDefinition {
  // A Direction label, not an enum. The canonical set is an open question
  // (AW-SRV-001), and a string lets the loader reject `norht` with an error
  // naming the file and line. A closed enum would drop it as an unknown member
  // on the wire, which is silently worse.
  string direction = 1;

  // Target Room. Cross-Zone Exits are resolved at load time as
  // ZoneID+RoomID value pairs, never as pointers — that is ADR-0001's seam
  // invariant, and it is what allows a Zone to move to another process later
  // without rewriting its exits.
  string to_zone_id = 2;
  string to_room_id = 3;
}
