// Zone Definitions — the topology AW-SRV-001 loads into an immutable World.
//
// This is the canonical form. Builders do not author it directly: ADR-0007
// makes protobuf the authority and ADR-0009 puts a purpose-built text language
// in front of it, because nobody hand-writes protobuf for a room description.
//
// AW-SRV-001's loader takes []ZoneDefinition and does not care where they came
// from, which is what lets one validator serve the CLI, the publish path, and
// load time (ADR-0004).

syntax = "proto3";

package andara.content.v1;

message ZoneDefinition {
  // Rejected at load with both the file's version and the supported range
  // named, rather than being partially understood (ADR-0004).
  uint32 format_version = 1;

  string id = 2;
  string name = 3;

  // Sorted by room id by the compiler. Load must be deterministic: the same
  // definition must produce the same World, and a repeated field with a stable
  // order is what gives that. A map would not — see andara/log/v1/log.proto for
  // why unspecified ordering is disqualifying anywhere near the State Hash.
  repeated RoomDefinition rooms = 4;

  // Zone-wide Components (ADR-0010 decision 8). Sorted by type by the compiler,
  // at most one of each type. Zone-level Components do not descend onto the
  // Zone's Rooms: a Zone carrying Dark does not make its Rooms dark
  // (AW-SRV-021 AC-4). Merging across a containment boundary is a different
  // rule from ADR-0010 decision 4's inheritance merge and wants its own
  // decision.
  repeated ComponentValue components = 5;

  // The Room an Entity is moved to when a new content version removes the Room
  // it stands in (ADR-0004, AW-SRV-012). A Room ID in this Zone. Required:
  // empty, or naming a Room this definition does not contain, is the load
  // finding `fallback_missing`, and the version is refused. It is the one Room
  // a Zone may not delete. In the Content Language it is `fallback <room>`
  // (semantics.md §9).
  string fallback_room = 6;

  // The Zone→Partition mapping is hash(id) % 64, computed at load rather than
  // carried here (AW-SRV-001). Content does not get to choose its partition:
  // the mapping is permanent because repartitioning a keyed topic reorders
  // history (ADR-0002).
}

message RoomDefinition {
  // Unique within the Zone. Duplicates are a load error.
  string id = 1;
  string title = 2;
  string description = 3;

  // Sorted by direction. Every target must resolve to an existing Room, in this
  // Zone or another, or the load fails naming the file, room, and direction
  // (AW-SRV-001).
  repeated ExitDefinition exits = 4;

  // Components attached to this Room (ADR-0010 decision 8) — the field number
  // zone.proto held open for exactly this. Sorted by type by the compiler, at
  // most one of each type (ADR-0010 decision 3): two of a thing has no
  // override semantics, so the loader rejects it rather than picking one.
  //
  // `repeated`, not `map`, because a Room's components feed the State Hash and
  // ADR-0007 rule 3 forbids maps there.
  repeated ComponentValue components = 5;
}

message ExitDefinition {
  // A Direction label, not an enum. The canonical set is closed as of
  // 2026-09-10 — the twelve in docs/glossary.md — but it is closed in the
  // loader's validation, not here: a string lets the loader reject `norht`
  // with an error naming the file and line, where a closed enum would drop it
  // as an unknown member on the wire, which is silently worse. Growing the set
  // stays a validation change, never a schema change.
  string direction = 1;

  // Target Room. Cross-Zone Exits are resolved at load time as Zone+Room value
  // pairs, never as pointers — ADR-0001's seam invariant, and what allows a
  // Zone to move to another process later without rewriting its exits.
  //
  // Empty `to_zone` means the containing Zone, which is the common case and
  // keeps intra-Zone exits terse. `to_room` is always required.
  string to_zone = 2;
  string to_room = 3;
}

// ComponentValue is one Component attached to a Room or a Zone.
//
// Components are data; systems hold the logic (ADR-0010). Nothing here is
// executable and nothing here is read by the loader beyond validating it.
message ComponentValue {
  // Namespaced Component type, e.g. "andara.core.Dark" (ADR-0010 decision 6).
  // Rejected at load if the server has no such type registered: Component
  // types are defined on the server and Builders compose them rather than
  // creating them (ADR-0010 decision 7).
  string type = 1;

  // Field values for the Component. Deliberately not google.protobuf.Any and
  // not a map: ADR-0007 rule 3 forbids both anywhere near the State Hash.
  // Sorted by name by the compiler, like every other repeated field the sim
  // hashes. A field the registry does not declare on this type is a load
  // error — an undeclared field would otherwise be hashed into World state
  // while meaning nothing to any system.
  repeated ComponentField fields = 2;
}

// ComponentField is one named value inside a ComponentValue.
message ComponentField {
  // Unique within the ComponentValue. Duplicates are a load error.
  string name = 1;

  // No double or float member, and none may be added: a float in the State
  // Hash makes the hash platform-dependent (ADR-0007 rule 3). A quantity that
  // wants a fraction is an integer in fixed units, decided when the first
  // Component needs one.
  oneof value {
    string string_value = 2;
    int64 int_value = 3;
    bool bool_value = 4;
  }
}
