// The content store (ADR-0004).
//
// Three compacted topics, and the shape matters because the obvious
// single-topic design does not actually version anything:
//
//   andara.content.blobs.v1     key = sha256(body)   — immutable, permanent
//   andara.content.versions.v1  key = packID@version — full history retained
//   andara.content.active.v1    key = packID         — the only mutable pointer
//
// Compaction keeps the newest value per key. Keying history by packID@version
// is what turns that from a history-eraser into a history-preserver, and
// keying blobs by their own hash means compaction never removes one.

syntax = "proto3";

package andara.content.v1;

// A content blob, addressed by the hash of its body.
message Blob {
  // sha256 of `body`. The record key on andara.content.blobs.v1.
  bytes hash = 1;
  bytes body = 2;
  // Diagnostic: what this blob was when it was written.
  string media_type = 3;
}

// An immutable version manifest. Keyed by packID@version, so publishing never
// overwrites a previous version.
message ContentVersion {
  string pack_id = 1;
  // Monotonic per pack, assigned by the server rather than the Builder
  // (AW-SRV-013). andara.core is the exception: its version is the build's
  // content/core/VERSION, so andara.core@N is the same bytes in every
  // environment (ADR-0004, 2026-09-28).
  uint64 version = 2;

  // The version this was published on top of. Zero for the first, which is
  // what makes the history a chain rather than a set.
  uint64 parent_version = 3;

  repeated BlobRef blobs = 4;

  // Who published it. Every publish is audited (ADR-0004); this is the record,
  // not the audit trail itself, which lives on andara.audit.v1. For a
  // publish in an acting-as Session, the acting-as Account; the audit record
  // names the real actor too. For andara.core, the reserved principal
  // `server`, which is not an Account and cannot authenticate.
  string author = 5;
  int64 published_at_unix_nano = 6;

  // Set when an approver has approved this version for activation: a second
  // Builder holding the pack, or an OPERATOR, who may approve their own
  // publish while content.operator_self_approval holds (ADR-0004, amended
  // 2026-09-26).
  // Publishing is a single-Builder action; moving the Active Pointer is not
  // (AW-SRV-013, decided 2026-09-07). Empty means unapproved, and an
  // activation naming an unapproved version is rejected by the server.
  string approved_by = 7;
  int64 approved_at_unix_nano = 8;

  // The core pack version this content was compiled against. ADR-0010 publishes
  // base Templates as `andara.core`, and a Builder pack pins what it compiled
  // against so version skew is a legible error rather than a mystery. The
  // server reads it from the compiled pack (`requires andara.core@N`); a
  // publisher does not supply it. 0 for andara.core itself.
  uint64 core_version = 9;

  // The real actor who wrote this manifest (AW-SRV-039): the caller's Account,
  // whoever they acted as. `author` is the acting-as Account when there was
  // one, so for an acted-as publish author != publisher; otherwise the two are
  // equal. Always set on write. A manifest written before this field existed
  // reads empty, and is reported as equal to `author`: true, not a fallback,
  // because no acted-as manifest could exist before it. Kept here and not
  // rebuilt from the audit topic, which does not outlive its 365-day retention
  // or an `auth.store=memory` restart. For andara.core, `server`, as author.
  string publisher = 10;
}

message BlobRef {
  // Path within the pack. Sorted by the publisher so a manifest encodes
  // identically for identical content.
  string path = 1;
  bytes hash = 2;
  uint64 size_bytes = 3;
}

// The Active Pointer: which version of a pack is live. The only mutable record
// in the content store, and rollback is one write of this (ADR-0004).
message ActiveVersion {
  string pack_id = 1;
  uint64 version = 2;
  // Who moved the pointer: the caller of ActivateVersion, or `server` for
  // andara.core activated at boot. The boot never moves a core pointer an
  // Account moved last (AW-SRV-013).
  string activated_by = 3;
  int64 activated_at_unix_nano = 4;
  // The W3C traceparent of the ActivateVersion call that moved the pointer
  // (AW-SRV-045), so the Loader's content.load can link to it. A link, not a
  // parent: one debounced load can serve several moves. Empty for the boot's
  // core activation and for a record written before this field existed, both
  // meaning no link. Diagnostic: it never affects what loads, and the pointer
  // record is not World state, so the State Hash is unchanged.
  string trace_parent = 5;
}

// One finding from the compiler or the validator, as errors.md §1 shapes it.
// The same shape andara-cli prints and make content-conformance compares, so
// the three runners AW-CLI-002 AC-4 holds equal compare values, not a
// mapping.
message Diagnostic {
  // Within the pack, as published (`src/town.aw`).
  string file = 1;
  // 1-based. 0 when the finding is pack-level.
  uint32 line = 2;
  // 1-based, in runes.
  uint32 col = 3;
  // errors.md §3.
  string code = 4;
  string message = 5;
  // The declaration chain, outermost first.
  repeated string chain = 6;
  Severity severity = 7;
  // Set only by the publish gate, on a finding in another pack's blobs: that
  // pack's id (errors.md §1 rule 10.6). Empty means the caller's own pack.
  string pack = 8;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  ERROR = 1;
  WARNING = 2;
}
