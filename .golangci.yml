# Lint configuration for andara. golangci-lint v2 schema.
#
# The depguard block below is not style. It is ADR-0001's simulation-core seam invariant
# and ADR-0002's determinism requirement, made mechanical: `make lint` fails if anything
# under server/sim reaches the network, a datastore, the filesystem, the wall clock, or
# global randomness. Widening the denied list requires an explicit, reviewable diff and an
# ADR that authorizes it.
#
# errcheck, govet, ineffassign, staticcheck, and unused are on by default in v2 and are
# listed here anyway, because "which linters run" should be readable without knowing the
# tool's defaults.

version: "2"
run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        sim-core-is-dependency-free:
          files:
            - '**/server/sim/**'
          deny:
            - pkg: net
              desc: sim core is transport-agnostic; transport lives in the Gateway (AW-SRV-005)
            - pkg: net/http
              desc: sim core is transport-agnostic
            - pkg: database/sql
              desc: persistence is an adapter behind an interface the sim owns (ADR-0002)
            - pkg: os
              desc: sim core does no I/O; loading lives outside the core (AW-SRV-001)
            - pkg: io/ioutil
              desc: sim core does no I/O
            - pkg: math/rand
              desc: use the seeded, snapshot-able PRNG; global rand breaks replay (ADR-0002)
            - pkg: math/rand/v2
              desc: use the seeded, snapshot-able PRNG; global rand breaks replay (ADR-0002)
            - pkg: time
              desc: the sim advances by Tick, not by wall clock; a Tick number is the only time it may read (ADR-0002, ADR-0008). depguard cannot allow time.Duration alone, so durations enter the core as a Tick count.
            - pkg: google.golang.org/grpc
              desc: sim core is transport-agnostic; gRPC lives in the Gateway (ADR-0003, AW-SRV-005)
            - pkg: connectrpc.com/connect
              desc: sim core is transport-agnostic (ADR-0003)
            - pkg: github.com/twmb/franz-go
              desc: the log is an adapter behind an interface the sim owns, not an import (ADR-0002)
            - pkg: github.com/segmentio/kafka-go
              desc: the log is an adapter behind an interface the sim owns (ADR-0002)
            - pkg: github.com/confluentinc/confluent-kafka-go
              desc: the log is an adapter behind an interface the sim owns (ADR-0002)
            - pkg: github.com/redis/go-redis
              desc: Redis is a projection built from the log; the sim never reads an index (ADR-0002 §5.5)
            - pkg: github.com/jackc/pgx
              desc: Postgres is a projection; the in-game read path is memory, not a datastore (ADR-0002)
            - pkg: github.com/lib/pq
              desc: Postgres is a projection (ADR-0002)
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^gen/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^gen/
